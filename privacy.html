<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Privacy — Margo</title>
  <meta name="description" content="Margo's privacy policy. Simple, honest, and to the point."/>
  <link rel="canonical" href="https://trymargo.com/privacy"/>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700&family=DM+Serif+Display:ital@0;1&family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css"/>
  <style>
    .legal-wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 80px 24px 120px;
    }
    .legal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid rgba(232,197,71,0.1);
      position: sticky;
      top: 0;
      background: rgba(11,11,13,0.92);
      backdrop-filter: blur(16px);
      z-index: 100;
    }
    .legal-nav-logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 3px;
      color: #E8C547;
      text-decoration: none;
      text-transform: uppercase;
    }
    .legal-nav-back {
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      color: rgba(255,255,255,0.4);
      text-decoration: none;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: color 0.18s;
    }
    .legal-nav-back:hover { color: #E8C547; }
    .legal-eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #E8C547;
      margin-bottom: 16px;
    }
    .legal-title {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      color: #F0F0F0;
      line-height: 1.15;
      margin-bottom: 12px;
    }
    .legal-date {
      font-family: 'Space Mono', monospace;
      font-size: 0.55rem;
      color: rgba(255,255,255,0.25);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    .legal-body {
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      line-height: 1.75;
      color: rgba(240,240,240,0.72);
    }
    .legal-body p { margin-bottom: 1.4em; }
    .legal-body h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.2rem;
      color: #F0F0F0;
      margin: 2.4em 0 0.8em;
      font-style: italic;
    }
    .legal-body ul {
      padding-left: 20px;
      margin-bottom: 1.4em;
    }
    .legal-body ul li { margin-bottom: 0.5em; }
    .legal-body strong { color: rgba(240,240,240,0.9); font-weight: 600; }
    .legal-body a { color: #E8C547; text-decoration: none; }
    .legal-body a:hover { text-decoration: underline; }
    .legal-divider {
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, #E8C547, transparent);
      margin: 32px 0;
      border: none;
    }
    .legal-footer-links {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      margin-top: 64px;
      padding-top: 32px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .legal-footer-links a {
      font-family: 'Space Mono', monospace;
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.3);
      text-decoration: none;
      transition: color 0.18s;
    }
    .legal-footer-links a:hover { color: #E8C547; }
  </style>
</head>
<body>
<div class="ambient ambient-1"></div>
<div class="ambient ambient-2"></div>

<nav class="legal-nav">
  <a href="/" class="legal-nav-logo">Margo</a>
  <a href="/" class="legal-nav-back">← Back to Margo</a>
</nav>

<div class="legal-wrap">
  <div class="legal-eyebrow">Privacy Policy</div>
  <h1 class="legal-title">Your data.<br/>Kept simple.</h1>
  <div class="legal-date" id="page-date">Effective: January 2025</div>
  <hr class="legal-divider"/>

  <div class="legal-body" id="page-content">
    <span style="font-family:'Space Mono',monospace;font-size:0.6rem;color:rgba(255,255,255,0.2)">Loading…</span>
  </div>

  <div class="legal-footer-links">
    <a href="/about">About</a>
    <a href="/privacy">Privacy</a>
    <a href="/terms">Terms</a>
    <a href="/contact">Contact</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: 'AIzaSyA1AuUethACF_9aBqbOONjra7X5NbGnfZM',
    authDomain: 'margo-f6da4.firebaseapp.com',
    databaseURL: 'https://margo-f6da4-default-rtdb.firebaseio.com',
    projectId: 'margo-f6da4',
    storageBucket: 'margo-f6da4.firebasestorage.app',
    messagingSenderId: '150183564620',
    appId: '1:150183564620:web:a42de7fef39740b551ebe9'
  };

  const DEFAULT_CONTENT = `<p>Margo is built to be as lightweight as possible — on your data and on your trust.</p>

<h2>What we collect</h2>
<p>Margo does not require an account to post or browse.</p>
<p>We do not collect your email address, phone number, or any personal identity information for basic use of the platform.</p>
<p>We may collect limited technical data to keep things running — things like general usage patterns, device type, or error logs. This data is never tied to your identity.</p>

<h2>Song metadata</h2>
<p>When you post a lyric and identify a song, Margo uses publicly available metadata from licensed third-party providers to display song information and link to official streaming services. We do not store full lyrics or audio files.</p>

<h2>Third-party services</h2>
<p>Margo may connect to services like Spotify, Apple Music, YouTube, or Deezer. When you follow one of those links, you leave Margo and are subject to their own privacy policies. We are not responsible for what they collect.</p>
<p>We may use analytics tools to understand how the platform is used at an aggregate level. These tools operate under their own policies.</p>

<h2>Data security</h2>
<p>We take reasonable steps to protect any data that passes through Margo. That said, no online service can promise perfect security — and we won't pretend otherwise.</p>

<h2>International users</h2>
<p>Margo is available globally. If you use Margo from outside the country where its infrastructure is hosted, your data may be processed across borders. By using Margo, you acknowledge this.</p>

<h2>Future changes</h2>
<p>If Margo introduces account features or changes how data is handled, this policy will be updated before those changes go live.</p>

<h2>Questions</h2>
<p>Reach us at <a href="mailto:contact@trymargo.com">contact@trymargo.com</a></p>`;

  try {
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    db.ref('pages/privacy').once('value').then(snap => {
      const data = snap.val();
      if (data) {
        document.getElementById('page-content').innerHTML = data.content || DEFAULT_CONTENT;
        if (data.date) document.getElementById('page-date').textContent = 'Effective: ' + data.date;
      } else {
        document.getElementById('page-content').innerHTML = DEFAULT_CONTENT;
      }
    }).catch(() => {
      document.getElementById('page-content').innerHTML = DEFAULT_CONTENT;
    });
  } catch(e) {
    document.getElementById('page-content').innerHTML = DEFAULT_CONTENT;
  }
</script>
</body>
</html>
