<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Music — Margo</title>
  <meta name="description" content="Original music by Margo. Listen, read every lyric, and share the lines that say what you couldn't."/>
  <meta property="og:type" content="website"/>
  <meta property="og:site_name" content="MARGO"/>
  <meta property="og:title" content="Music — Margo"/>
  <meta property="og:url" content="https://trymargo.com/music"/>
  <meta property="og:image" content="https://trymargo.com/og-image.png"/>
  <link rel="canonical" href="https://trymargo.com/music"/>
  <link rel="icon" href="/favicons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicons/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/favicons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/base.css">

  <style>
    body { margin:0; -webkit-font-smoothing:antialiased; background:var(--bg); }

    /* ── Ambient ── */
    .ambient { position:fixed; pointer-events:none; z-index:0; border-radius:50%; filter:blur(80px); opacity:0.06; }
    .ambient-1 { width:500px; height:500px; background:var(--gold); top:-100px; right:-100px; }
    .ambient-2 { width:400px; height:400px; background:#6B4EFF; bottom:-100px; left:-100px; }

    /* ── Nav ── */
    nav { display:flex; align-items:center; justify-content:space-between; padding:20px 24px;
      border-bottom:1px solid var(--gold-glow); position:sticky; top:0;
      background:rgba(7,6,10,0.92); backdrop-filter:blur(16px); z-index:100; }
    .nav-logo { font-family:'Syne',sans-serif; font-weight:800; font-size:0.9rem;
      letter-spacing:3px; color:var(--gold); text-decoration:none; text-transform:uppercase; }
    .nav-back { font-family:'Lora',serif; font-size:0.7rem; color:var(--text-3);
      text-decoration:none; letter-spacing:1px; text-transform:uppercase; transition:color 0.18s; }
    .nav-back:hover { color:var(--gold); }

    /* ── Page wrap ── */
    .page { max-width:500px; margin:0 auto; padding:0 0 120px; position:relative; z-index:1; }

    /* ── Page header ── */
    .page-header { padding:40px 24px 24px; }
    .page-eyebrow { font-family:'Lora',serif; font-size:0.6rem; font-weight:600;
      letter-spacing:2px; text-transform:uppercase; color:var(--gold); margin-bottom:10px; }
    .page-title { font-family:'Lora',serif; font-size:1.5rem; font-weight:700;
      color:var(--text); line-height:1.2; margin-bottom:8px; }
    .page-sub { font-family:'Lora',serif; font-size:0.82rem; color:var(--text-3); line-height:1.6; }

    /* ── Song card (list) ── */
    .song-card { margin:0 16px 10px; background:var(--surface); border:1px solid var(--border);
      border-radius:16px; overflow:hidden; transition:border-color 0.18s; cursor:pointer; }
    .song-card:hover { border-color:var(--gold-border); }
    .song-card.featured { border-color:var(--gold-border); }
    .song-card-inner { display:flex; gap:14px; align-items:center; padding:16px; }
    .song-cover { width:56px; height:56px; border-radius:10px; flex-shrink:0;
      background:var(--surface-3); overflow:hidden; display:flex; align-items:center;
      justify-content:center; font-family:'Syne',sans-serif; font-weight:800;
      font-size:1rem; color:var(--gold); }
    .song-cover img { width:100%; height:100%; object-fit:cover; }
    .song-info { flex:1; min-width:0; }
    .song-title { font-family:'Lora',serif; font-size:1rem; font-weight:700; color:var(--text);
      margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .song-artist { font-family:'Lora',serif; font-size:0.7rem; color:var(--text-3); margin-bottom:8px; }
    .song-tags { display:flex; gap:6px; flex-wrap:wrap; }
    .song-tag { font-family:'Lora',serif; font-size:0.55rem; font-weight:700;
      text-transform:uppercase; letter-spacing:0.8px; padding:3px 10px;
      border-radius:50px; border:1px solid; }
    .tag-live { color:var(--success); border-color:var(--success-border); }
    .tag-coming { color:var(--gold); border-color:var(--gold-border); }
    .tag-planned { color:var(--text-3); border-color:var(--border); }
    .tag-featured { color:var(--gold); border-color:var(--gold-border);
      background:var(--gold-faint); }

    /* ── Section label ── */
    .section-label { font-family:'Lora',serif; font-size:0.6rem; font-weight:600;
      text-transform:uppercase; letter-spacing:2px; color:var(--text-3);
      padding:0 24px; margin:32px 0 12px; }

    /* ── Player overlay ── */
    #playerOverlay { display:none; position:fixed; inset:0; z-index:500;
      background:var(--bg); flex-direction:column; overflow:hidden; }
    #playerOverlay.open { display:flex; }

    /* ── Player nav ── */
    .player-nav { display:flex; align-items:center; justify-content:space-between;
      padding:20px 24px; border-bottom:1px solid var(--gold-glow);
      background:rgba(7,6,10,0.92); backdrop-filter:blur(16px); flex-shrink:0; }
    .player-back { font-family:'Lora',serif; font-size:0.7rem; color:var(--text-3);
      background:none; border:none; cursor:pointer; letter-spacing:1px;
      text-transform:uppercase; transition:color 0.18s; min-height:44px; padding:0; }
    .player-back:hover { color:var(--gold); }
    .player-song-label { font-family:'Lora',serif; font-size:0.7rem; font-weight:600;
      color:var(--text); text-align:right; max-width:180px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    /* ── Player body ── */
    .player-body { flex:1; overflow-y:auto; padding:24px 24px 40px; }

    /* ── Cover + controls ── */
    .player-header { display:flex; gap:16px; align-items:flex-start; margin-bottom:24px; }
    .player-cover { width:80px; height:80px; border-radius:12px; flex-shrink:0;
      background:var(--surface-3); overflow:hidden; display:flex; align-items:center;
      justify-content:center; font-family:'Syne',sans-serif; font-weight:800;
      font-size:1.4rem; color:var(--gold); }
    .player-cover img { width:100%; height:100%; object-fit:cover; }
    .player-meta { flex:1; padding-top:4px; }
    .player-title { font-family:'Lora',serif; font-size:1.15rem; font-weight:700;
      color:var(--text); margin-bottom:4px; }
    .player-artist { font-family:'Lora',serif; font-size:0.82rem; color:var(--text-3);
      margin-bottom:12px; }

    /* ── Platform links ── */
    .platform-links { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
    .platform-btn { font-family:'Lora',serif; font-size:0.55rem; font-weight:700;
      text-transform:uppercase; letter-spacing:0.8px; padding:7px 12px;
      border-radius:50px; border:1px solid var(--border); color:var(--text-2);
      text-decoration:none; transition:all 0.18s; min-height:32px;
      display:inline-flex; align-items:center; }
    .platform-btn:hover { border-color:var(--gold-border); color:var(--gold); }

    /* ── Progress bar ── */
    .progress-wrap { margin-bottom:20px; }
    .progress-bar { width:100%; height:3px; background:var(--surface-3);
      border-radius:50px; cursor:pointer; position:relative; margin-bottom:8px;
      -webkit-appearance:none; appearance:none; }
    .progress-bar::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px;
      border-radius:50%; background:var(--gold); cursor:pointer; margin-top:-5.5px; }
    .progress-bar::-webkit-slider-runnable-track { height:3px; border-radius:50px; }
    .progress-times { display:flex; justify-content:space-between;
      font-family:'Lora',serif; font-size:0.6rem; color:var(--text-3); }

    /* ── Play/pause controls ── */
    .player-controls { display:flex; align-items:center; gap:16px; margin-bottom:28px; }
    .play-btn { width:52px; height:52px; border-radius:50%; background:var(--gold);
      border:none; cursor:pointer; display:flex; align-items:center;
      justify-content:center; font-size:1.2rem; transition:all 0.18s;
      flex-shrink:0; }
    .play-btn:hover { background:var(--gold-warm); transform:scale(1.04); }
    .play-btn:active { transform:scale(0.96); }
    .play-status { font-family:'Lora',serif; font-size:0.7rem; color:var(--text-3);
      font-style:italic; }

    /* ── Karaoke lyrics ── */
    .lyrics-section { }
    .lyrics-label { font-family:'Lora',serif; font-size:0.6rem; font-weight:600;
      text-transform:uppercase; letter-spacing:2px; color:var(--text-3); margin-bottom:20px; }

    /* Hero lyric stage — the active line */
    .hero-stage { min-height:80px; display:flex; align-items:center;
      justify-content:center; text-align:center; padding:20px 0;
      margin-bottom:20px; position:relative; }
    .hero-lyric { font-family:'Lora',serif; font-size:1.4rem; font-weight:400;
      font-style:italic; color:var(--gold); line-height:1.4;
      transition:opacity 0.3s cubic-bezier(0.16,1,0.3,1),
                 transform 0.3s cubic-bezier(0.16,1,0.3,1);
      text-align:center; }

    /* Share a Lyric button — appears on active line */
    .share-lyric-btn { display:none; margin:0 auto 24px; padding:14px 24px;
      background:var(--gold); color:var(--bg); border:none; border-radius:12px;
      font-family:'Lora',serif; font-weight:700; font-size:0.7rem;
      text-transform:uppercase; letter-spacing:1px; cursor:pointer;
      min-height:52px; width:100%; max-width:320px;
      transition:all 0.18s; }
    .share-lyric-btn:hover { background:var(--gold-warm); transform:scale(1.01); }
    .share-lyric-btn:active { transform:scale(0.98); }
    .share-lyric-btn.visible { display:block; }

    /* Full lyrics list */
    .lyrics-list { display:flex; flex-direction:column; gap:2px; }
    .lyric-line { font-family:'Lora',serif; font-size:0.95rem; font-style:italic;
      color:var(--text-3); line-height:1.6; padding:10px 12px; border-radius:8px;
      cursor:pointer; transition:all 0.18s; border:1px solid transparent; }
    .lyric-line:hover { color:var(--text-2); background:var(--surface-2); }
    .lyric-line.active { color:var(--gold); background:var(--gold-faint);
      border-color:var(--gold-border); font-weight:600; }
    .lyric-line.past { opacity:0.45; }

    /* Coming soon state */
    .coming-state { text-align:center; padding:60px 24px; }
    .coming-title { font-family:'Lora',serif; font-size:1.15rem; font-weight:700;
      color:var(--text); margin-bottom:8px; }
    .coming-sub { font-family:'Lora',serif; font-size:0.82rem; color:var(--text-3);
      line-height:1.6; }
    .coming-date { display:inline-block; margin-top:16px; font-family:'Lora',serif;
      font-size:0.6rem; font-weight:700; text-transform:uppercase; letter-spacing:1px;
      color:var(--gold); border:1px solid var(--gold-border); border-radius:50px;
      padding:6px 16px; }

    /* Empty state */
    .empty-state { text-align:center; padding:80px 24px; }
    .empty-state p { font-family:'Lora',serif; font-size:0.95rem; color:var(--text-3);
      line-height:1.7; }

    /* Hidden YouTube player */
    #ytPlayer { position:absolute; left:-9999px; top:-9999px;
      width:1px; height:1px; pointer-events:none; }

    /* Loading skeleton */
    .sk-card { margin:0 16px 10px; height:88px; background:var(--surface);
      border-radius:16px; border:1px solid var(--border);
      animation:sk-pulse 1.6s ease-in-out infinite; }
    @keyframes sk-pulse {
      0%,100% { opacity:1; } 50% { opacity:0.45; }
    }

    @media (prefers-reduced-motion:reduce) {
      * { transition:none !important; animation:none !important; }
    }
  </style>
</head>

<body>
<div class="ambient ambient-1"></div>
<div class="ambient ambient-2"></div>

<!-- ── Nav ── -->
<nav>
  <a href="/" class="nav-logo">MARGO</a>
  <a href="/" class="nav-back">← Back</a>
</nav>

<!-- ── Song list page ── -->
<div class="page" id="songListPage">
  <div class="page-header">
    <div class="page-eyebrow">Original Music</div>
    <h1 class="page-title">When words fail,<br/>drop a lyric.</h1>
    <p class="page-sub">Songs by Margo. Listen, feel a line, share it.</p>
  </div>

  <div id="songListWrap">
    <!-- Loading skeletons -->
    <div class="sk-card"></div>
    <div class="sk-card" style="opacity:0.6;"></div>
    <div class="sk-card" style="opacity:0.35;"></div>
  </div>
</div>

<!-- ── Player overlay (full screen) ── -->
<div id="playerOverlay">
  <div class="player-nav">
    <button class="player-back" id="playerBackBtn">← All Songs</button>
    <div class="player-song-label" id="playerSongLabel"></div>
  </div>

  <div class="player-body" id="playerBody">

    <!-- Cover + meta -->
    <div class="player-header">
      <div class="player-cover" id="playerCover">M</div>
      <div class="player-meta">
        <div class="player-title" id="playerTitle"></div>
        <div class="player-artist" id="playerArtist"></div>
        <div class="platform-links" id="platformLinks"></div>
      </div>
    </div>

    <!-- Progress -->
    <div class="progress-wrap" id="progressWrap" style="display:none;">
      <input type="range" class="progress-bar" id="progressBar"
        min="0" max="100" value="0" step="0.1"/>
      <div class="progress-times">
        <span id="timeElapsed">0:00</span>
        <span id="timeDuration">0:00</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="player-controls">
      <button class="play-btn" id="playBtn" aria-label="Play">▶</button>
      <span class="play-status" id="playStatus">Tap to play</span>
    </div>

    <!-- Lyrics / karaoke -->
    <div class="lyrics-section" id="lyricsSection"></div>

  </div><!-- end player-body -->
</div><!-- end playerOverlay -->

<!-- Hidden YouTube iframe API target -->
<div id="ytPlayer"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* ============================================================
   music.js — inline
   Reads /songs from Firebase, renders song list,
   opens player, syncs karaoke to YouTube currentTime.
   ============================================================ */

let _songs        = [];
let _activeSong   = null;
let _ytPlayer     = null;
let _ytReady      = false;
let _syncInterval = null;
let _lyricsJson   = [];
let _activeLineIdx = -1;
let _isPlaying    = false;
let _duration     = 0;

/* ── Init Firebase ── */
async function initMusicFirebase() {
  try {
    const res = await fetch('/api/config');
    if (!res.ok) throw new Error('Config failed');
    const cfg = await res.json();
    firebase.initializeApp(cfg);
    loadSongs();
  } catch (e) {
    console.warn('[Music] Firebase init failed:', e.message);
    showEmptyState('Could not connect. Please refresh.');
  }
}

/* ── Normalise song — handles both old and new schema ── */
function _normaliseSong(s) {
  // status: old schema uses "active", new uses "live"
  if (s.status === 'active') s.status = 'live';
  // lyrics: old schema uses "srt", new uses "lyricsJson"
  if (!s.lyricsJson && s.srt) {
    s.lyricsJson = parseLyrics(s.srt);
  }
  // featured: old schema has no featured flag — treat order:1 as featured
  if (s.featured === undefined && s.order === 1) s.featured = true;
  return s;
}

/* ── Load songs from /songs ── */
function loadSongs() {
  firebase.database().ref('songs')
    .once('value')
    .then(snap => {
      _songs = [];
      snap.forEach(child => {
        const s = _normaliseSong(child.val());
        s.id = child.key;
        _songs.push(s);
      });
      // Sort by order field, fallback to createdAt
      _songs.sort((a, b) => (a.order || 99) - (b.order || 99));
      renderSongList();
    })
    .catch(() => showEmptyState('Could not load songs.'));
}

/* ── Render song list ── */
function renderSongList() {
  const wrap = document.getElementById('songListWrap');
  if (!wrap) return;
  wrap.innerHTML = '';

  if (!_songs.length) {
    showEmptyState('Music coming soon.');
    return;
  }

  // Featured first — first live song if none explicitly featured
  const featured = _songs.find(s => s.featured && s.status === 'live')
                || _songs.find(s => s.status === 'live');
  const rest      = _songs.filter(s => s !== featured);

  if (featured) {
    wrap.appendChild(_buildSongCard(featured, true));
  }

  const liveSongs    = rest.filter(s => s.status === 'live');
  const comingSongs  = rest.filter(s => s.status === 'coming');
  const plannedSongs = rest.filter(s => s.status === 'planned');

  if (liveSongs.length) {
    if (featured) {
      const lbl = document.createElement('div');
      lbl.className = 'section-label';
      lbl.textContent = 'More Songs';
      wrap.appendChild(lbl);
    }
    liveSongs.forEach(s => wrap.appendChild(_buildSongCard(s, false)));
  }

  if (comingSongs.length) {
    const lbl = document.createElement('div');
    lbl.className = 'section-label';
    lbl.textContent = 'Coming Soon';
    wrap.appendChild(lbl);
    comingSongs.forEach(s => wrap.appendChild(_buildSongCard(s, false)));
  }

  if (plannedSongs.length) {
    const lbl = document.createElement('div');
    lbl.className = 'section-label';
    lbl.textContent = 'In the Works';
    wrap.appendChild(lbl);
    plannedSongs.forEach(s => wrap.appendChild(_buildSongCard(s, false)));
  }
}

function _buildSongCard(song, isFeatured) {
  const card = document.createElement('div');
  card.className = 'song-card' + (isFeatured ? ' featured' : '');

  const statusTag = song.status === 'live'   ? '<span class="song-tag tag-live">Live</span>'
                  : song.status === 'coming' ? '<span class="song-tag tag-coming">Coming Soon</span>'
                  : '<span class="song-tag tag-planned">In the Works</span>';

  const featTag = isFeatured
    ? '<span class="song-tag tag-featured">Featured</span>'
    : '';

  card.innerHTML = `
    <div class="song-card-inner">
      <div class="song-cover" id="cover-${song.id}">
        ${song.coverUrl
          ? `<img src="${song.coverUrl}" alt="${song.title}" onerror="this.parentNode.textContent='M'"/>`
          : 'M'}
      </div>
      <div class="song-info">
        <div class="song-title">${song.title || 'Untitled'}</div>
        <div class="song-artist">${song.artist || 'Margo'}${song.releaseDate ? ' · ' + song.releaseDate : ''}</div>
        <div class="song-tags">${statusTag}${featTag}</div>
      </div>
    </div>
  `;

  card.onclick = () => openPlayer(song);
  return card;
}

function showEmptyState(msg) {
  const wrap = document.getElementById('songListWrap');
  if (wrap) wrap.innerHTML = `<div class="empty-state"><p>${msg}</p></div>`;
}

/* ══════════════════════════════════════
   PLAYER
══════════════════════════════════════ */
function openPlayer(song) {
  _activeSong   = song;
  _lyricsJson   = Array.isArray(song.lyricsJson) ? song.lyricsJson : [];
  _activeLineIdx = -1;
  _isPlaying    = false;

  // Update nav label
  const label = document.getElementById('playerSongLabel');
  if (label) label.textContent = song.title || '';

  // Cover
  const coverEl = document.getElementById('playerCover');
  if (coverEl) {
    if (song.coverUrl) {
      coverEl.innerHTML = `<img src="${song.coverUrl}" alt="${song.title}"
        onerror="this.parentNode.textContent='M'" style="width:100%;height:100%;object-fit:cover;border-radius:12px;"/>`;
    } else {
      coverEl.textContent = 'M';
    }
  }

  // Title / artist
  const titleEl  = document.getElementById('playerTitle');
  const artistEl = document.getElementById('playerArtist');
  if (titleEl)  titleEl.textContent  = song.title  || '';
  if (artistEl) artistEl.textContent = (song.artist || 'Margo') + (song.releaseDate ? ' · ' + song.releaseDate : '');

  // Platform links
  _renderPlatformLinks(song);

  // Lyrics section
  _renderLyricsSection(song);

  // Progress bar — show only if YouTube ID exists
  const progressWrap = document.getElementById('progressWrap');
  if (progressWrap) progressWrap.style.display = song.youtubeId ? 'block' : 'none';

  // Reset controls
  _setPlayBtn(false);
  const playStatus = document.getElementById('playStatus');
  if (playStatus) playStatus.textContent = song.youtubeId ? 'Tap to play' : '';

  // Show overlay
  const overlay = document.getElementById('playerOverlay');
  if (overlay) overlay.classList.add('open');
  document.body.style.overflow = 'hidden';

  // Init YouTube if needed
  if (song.youtubeId) {
    _initYT(song.youtubeId);
  }

  // Back button
  const backBtn = document.getElementById('playerBackBtn');
  if (backBtn) backBtn.onclick = closePlayer;

  // Play button
  const playBtn = document.getElementById('playBtn');
  if (playBtn) playBtn.onclick = togglePlay;

  // Progress seek
  const progressBar = document.getElementById('progressBar');
  if (progressBar) {
    progressBar.oninput = e => {
      if (_ytPlayer && _ytReady && _duration) {
        const t = (e.target.value / 100) * _duration;
        _ytPlayer.seekTo(t, true);
      }
    };
  }
}

function closePlayer() {
  const overlay = document.getElementById('playerOverlay');
  if (overlay) overlay.classList.remove('open');
  document.body.style.overflow = '';
  _stopSync();
  if (_ytPlayer && _ytReady) {
    try { _ytPlayer.stopVideo(); } catch(e) {}
  }
  _isPlaying = false;
  _setPlayBtn(false);
}

/* ── Platform links ── */
function _renderPlatformLinks(song) {
  const wrap = document.getElementById('platformLinks');
  if (!wrap) return;
  wrap.innerHTML = '';
  const p = song.platforms || {};
  const defs = [
    { key:'youtube',   label:'YouTube'   },
    { key:'audiomack', label:'Audiomack' },
    { key:'boomplay',  label:'Boomplay'  },
    { key:'soundcloud',label:'SoundCloud'},
    { key:'spotify',   label:'Spotify'   },
    { key:'apple',     label:'Apple Music'},
  ];
  defs.forEach(({ key, label }) => {
    const url = p[key];
    if (!url) return;
    const a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.className = 'platform-btn';
    a.textContent = label;
    wrap.appendChild(a);
  });
}

/* ── Lyrics section ── */
function _renderLyricsSection(song) {
  const section = document.getElementById('lyricsSection');
  if (!section) return;
  section.innerHTML = '';

  if (song.status === 'coming' || song.status === 'planned') {
    section.innerHTML = `
      <div class="coming-state">
        <div class="coming-title">${song.title}</div>
        <div class="coming-sub">This song is on its way.<br/>Follow along on the feed when it drops.</div>
        ${song.releaseDate ? `<span class="coming-date">Dropping ${song.releaseDate}</span>` : ''}
      </div>`;
    return;
  }

  if (!_lyricsJson.length) {
    section.innerHTML = `<div style="padding:40px 0;text-align:center;
      font-family:'Lora',serif;font-size:0.82rem;color:var(--text-3);font-style:italic;">
      Lyrics coming soon</div>`;
    return;
  }

  // Hero stage
  const heroStage = document.createElement('div');
  heroStage.className = 'hero-stage';
  heroStage.id = 'heroStage';
  heroStage.innerHTML = `<div class="hero-lyric" id="heroLyric">&nbsp;</div>`;
  section.appendChild(heroStage);

  // Share a Lyric button
  const shareBtn = document.createElement('button');
  shareBtn.className = 'share-lyric-btn';
  shareBtn.id = 'shareLyricBtn';
  shareBtn.textContent = '+ Share a Lyric';
  shareBtn.onclick = _shareActiveLyric;
  section.appendChild(shareBtn);

  // Divider
  const lbl = document.createElement('div');
  lbl.className = 'lyrics-label';
  lbl.textContent = 'Full Lyrics — tap any line to jump';
  section.appendChild(lbl);

  // Lines list
  const list = document.createElement('div');
  list.className = 'lyrics-list';
  list.id = 'lyricsList';

  _lyricsJson.forEach((line, i) => {
    const el = document.createElement('div');
    el.className = 'lyric-line';
    el.dataset.idx = i;
    el.textContent = line.text;
    el.onclick = () => {
      if (_ytPlayer && _ytReady) {
        _ytPlayer.seekTo(line.start, true);
        if (!_isPlaying) { _ytPlayer.playVideo(); }
      }
    };
    list.appendChild(el);
  });

  section.appendChild(list);
}

/* ── Share active lyric → pre-fill composer ── */
function _shareActiveLyric() {
  if (_activeLineIdx < 0 || !_lyricsJson[_activeLineIdx]) return;
  const line = _lyricsJson[_activeLineIdx];
  const song = _activeSong;
  const text = `"${line.text}" — ${song?.title || ''}, ${song?.artist || 'Margo'}`;
  // Navigate to feed and open composer pre-filled
  const encoded = encodeURIComponent(line.text);
  const song_enc = encodeURIComponent(song?.title || '');
  const artist_enc = encodeURIComponent(song?.artist || 'Margo');
  window.location.href = `/?sharelyric=${encoded}&song=${song_enc}&artist=${artist_enc}`;
}

/* ══════════════════════════════════════
   YOUTUBE PLAYER
══════════════════════════════════════ */
function _initYT(videoId) {
  _ytReady = false;
  _stopSync();

  if (window.YT && window.YT.Player) {
    _createYTPlayer(videoId);
    return;
  }
  // Load YouTube IFrame API
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
  window.onYouTubeIframeAPIReady = () => _createYTPlayer(videoId);
}

function _createYTPlayer(videoId) {
  // Destroy old player
  if (_ytPlayer) {
    try { _ytPlayer.destroy(); } catch(e) {}
    _ytPlayer = null;
  }
  const container = document.getElementById('ytPlayer');
  if (container) container.innerHTML = '<div id="ytPlayerInner"></div>';

  _ytPlayer = new YT.Player('ytPlayerInner', {
    videoId,
    playerVars: {
      autoplay:       0,
      controls:       0,
      disablekb:      1,
      fs:             0,
      modestbranding: 1,
      rel:            0,
    },
    events: {
      onReady:       () => { _ytReady = true; _duration = _ytPlayer.getDuration() || 0; _updateDurationDisplay(); },
      onStateChange: e  => _onYTStateChange(e),
    }
  });
}

function _onYTStateChange(e) {
  const YTS = YT.PlayerState;
  if (e.data === YTS.PLAYING) {
    _isPlaying = true;
    _setPlayBtn(true);
    _duration = _ytPlayer.getDuration() || 0;
    _updateDurationDisplay();
    _startSync();
    const playStatus = document.getElementById('playStatus');
    if (playStatus) playStatus.textContent = 'Now playing';
  } else if (e.data === YTS.PAUSED || e.data === YTS.ENDED) {
    _isPlaying = false;
    _setPlayBtn(false);
    _stopSync();
    const playStatus = document.getElementById('playStatus');
    if (playStatus) playStatus.textContent = e.data === YTS.ENDED ? 'Ended' : 'Paused';
  }
}

function togglePlay() {
  if (!_ytPlayer || !_ytReady) {
    // No YouTube ID — open YouTube link
    const url = _activeSong?.platforms?.youtube || (_activeSong?.youtubeId ? `https://www.youtube.com/watch?v=${_activeSong.youtubeId}` : null);
    if (url) window.open(url, '_blank');
    return;
  }
  if (_isPlaying) { _ytPlayer.pauseVideo(); }
  else            { _ytPlayer.playVideo();  }
}

function _setPlayBtn(playing) {
  const btn = document.getElementById('playBtn');
  if (btn) btn.textContent = playing ? '⏸' : '▶';
}

/* ── Lyric sync loop ── */
function _startSync() {
  _stopSync();
  _syncInterval = setInterval(_syncLyrics, 100);
}

function _stopSync() {
  if (_syncInterval) { clearInterval(_syncInterval); _syncInterval = null; }
}

function _syncLyrics() {
  if (!_ytPlayer || !_ytReady || !_lyricsJson.length) return;

  let currentTime;
  try { currentTime = _ytPlayer.getCurrentTime() || 0; } catch(e) { return; }

  // Update progress bar
  const bar = document.getElementById('progressBar');
  if (bar && _duration) bar.value = (currentTime / _duration) * 100;
  const elapsed = document.getElementById('timeElapsed');
  if (elapsed) elapsed.textContent = _fmtTime(currentTime);

  // Find active line
  let newIdx = -1;
  for (let i = 0; i < _lyricsJson.length; i++) {
    const line = _lyricsJson[i];
    if (currentTime >= line.start && currentTime < line.end) {
      newIdx = i;
      break;
    }
  }

  // Check if a line's start time has just passed but end not reached
  // (handles gaps between lines where no line is technically "active")
  if (newIdx === -1) {
    for (let i = _lyricsJson.length - 1; i >= 0; i--) {
      if (currentTime >= _lyricsJson[i].start) { newIdx = i; break; }
    }
    // But respect end time — if past end, treat as gap
    if (newIdx !== -1 && currentTime > _lyricsJson[newIdx].end + 0.1) {
      newIdx = -1;
    }
  }

  if (newIdx === _activeLineIdx) return;
  _activeLineIdx = newIdx;
  _updateLyricsUI(newIdx);
}

function _updateLyricsUI(idx) {
  // Update hero stage
  const heroLyric = document.getElementById('heroLyric');
  const shareBtn  = document.getElementById('shareLyricBtn');

  if (heroLyric) {
    if (idx >= 0 && _lyricsJson[idx]) {
      heroLyric.style.opacity = '0';
      heroLyric.style.transform = 'translateY(8px)';
      setTimeout(() => {
        heroLyric.textContent = _lyricsJson[idx].text;
        heroLyric.style.opacity = '1';
        heroLyric.style.transform = 'translateY(0)';
      }, 150);
    } else {
      heroLyric.textContent = '\u00a0'; // non-breaking space to hold height
    }
  }

  // Show/hide share button
  if (shareBtn) shareBtn.classList.toggle('visible', idx >= 0);

  // Update list lines
  const lines = document.querySelectorAll('.lyric-line');
  lines.forEach(el => {
    const i = parseInt(el.dataset.idx, 10);
    el.classList.toggle('active', i === idx);
    el.classList.toggle('past',   i < idx);
  });

  // Auto-scroll active line into view
  if (idx >= 0) {
    const activeLine = document.querySelector('.lyric-line.active');
    if (activeLine) {
      activeLine.scrollIntoView({ behavior:'smooth', block:'nearest' });
    }
  }
}

function _updateDurationDisplay() {
  const dur = document.getElementById('timeDuration');
  if (dur && _duration) dur.textContent = _fmtTime(_duration);
}

function _fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

/* ══════════════════════════════════════
   LYRIC PARSER (same as admin, inlined)
══════════════════════════════════════ */
function parseLyrics(raw) {
  if (!raw || !raw.trim()) return [];
  const text = raw.trim();
  if (/\d{2}:\d{2}:\d{2},\d{3}\s*-->\s*\d{2}:\d{2}:\d{2},\d{3}/.test(text)) return _parseSRT(text);
  if (/\[\d{2}:\d{2}[.:]\d{2,3}\]/.test(text)) return _parseLRC(text);
  return [];
}
function _srtTimeToSec(ts) {
  const [hms, ms] = ts.trim().split(',');
  const [h, m, s] = hms.split(':').map(Number);
  return h * 3600 + m * 60 + s + (parseInt(ms || '0', 10) / 1000);
}
function _parseSRT(text) {
  const lines = [];
  const blocks = text.split(/\n\s*\n/);
  for (const block of blocks) {
    const rows = block.trim().split('\n');
    const tsRow = rows.find(r => r.includes('-->'));
    if (!tsRow) continue;
    const [startStr, endStr] = tsRow.split('-->');
    const start = _srtTimeToSec(startStr);
    const end   = _srtTimeToSec(endStr);
    const tsIdx = rows.indexOf(tsRow);
    const lyricText = rows.slice(tsIdx + 1).filter(r => r.trim()).join(' ').trim();
    if (lyricText && !isNaN(start)) lines.push({ start, end, text: lyricText });
  }
  return lines;
}
function _parseLRC(text) {
  const lines = []; const parsed = [];
  for (const row of text.split('\n')) {
    const match = row.match(/^(\[\d{2}:\d{2}[.:]\d{2,3}\])\s*(.*)$/);
    if (!match) continue;
    const clean = match[1].replace(/[\[\]]/g,'');
    const [mStr, sStr] = clean.split(':');
    const start = parseInt(mStr,10) * 60 + parseFloat(sStr);
    const t = match[2].trim();
    if (t && !t.startsWith('[')) parsed.push({ start, text: t });
  }
  for (let i = 0; i < parsed.length; i++) {
    lines.push({ start: parsed[i].start,
      end: parsed[i+1] ? parsed[i+1].start : parsed[i].start + 5,
      text: parsed[i].text });
  }
  return lines;
}

/* ── Boot ── */
initMusicFirebase();
