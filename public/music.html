<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Music — Margo</title>
  <meta name="description" content="Original music by Margo. Listen, read every lyric, and share the lines that say what you couldn't."/>
  <meta property="og:type" content="website"/>
  <meta property="og:site_name" content="MARGO"/>
  <meta property="og:title" content="Music — Margo"/>
  <meta property="og:url" content="https://trymargo.com/music"/>
  <meta property="og:image" content="https://trymargo.com/og-image.png"/>
  <link rel="canonical" href="https://trymargo.com/music"/>
  <link rel="icon" href="/favicons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicons/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/favicons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/base.css">

  <style>
    /* ─────────────────────────────────────────
       BASE
    ───────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      overflow-x: hidden;
    }

    /* ─────────────────────────────────────────
       AMBIENT GLOW
    ───────────────────────────────────────── */
    .ambient {
      position: fixed; pointer-events: none; z-index: 0;
      border-radius: 50%; filter: blur(80px); opacity: 0.06;
    }
    .ambient-1 { width: 500px; height: 500px; background: var(--gold); top: -100px; right: -100px; }
    .ambient-2 { width: 400px; height: 400px; background: #6B4EFF; bottom: -100px; left: -100px; }

    /* ─────────────────────────────────────────
       NAV
    ───────────────────────────────────────── */
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 24px; border-bottom: 1px solid var(--gold-glow);
      position: sticky; top: 0;
      background: rgba(7,6,10,0.92); backdrop-filter: blur(16px);
      z-index: 100;
    }
    .nav-logo {
      font-family: 'Syne', sans-serif; font-weight: 800; font-size: 0.9rem;
      letter-spacing: 3px; color: var(--gold); text-decoration: none;
      text-transform: uppercase;
    }
    .nav-back {
      font-family: 'Lora', serif; font-size: 0.7rem; color: var(--text-3);
      text-decoration: none; letter-spacing: 1px; text-transform: uppercase;
      transition: color 0.18s;
    }
    .nav-back:hover { color: var(--gold); }

    /* ─────────────────────────────────────────
       SONG LIST PAGE
    ───────────────────────────────────────── */
    .page {
      max-width: 500px; margin: 0 auto;
      padding: 0 0 120px; position: relative; z-index: 1;
    }
    .page-header { padding: 40px 24px 24px; }
    .page-eyebrow {
      font-family: 'Lora', serif; font-size: 0.6rem; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase; color: var(--gold);
      margin-bottom: 10px;
    }
    .page-title {
      font-family: 'Lora', serif; font-size: 1.5rem; font-weight: 700;
      color: var(--text); line-height: 1.2; margin-bottom: 8px;
    }
    .page-sub {
      font-family: 'Lora', serif; font-size: 0.82rem;
      color: var(--text-3); line-height: 1.6;
    }

    /* ─────────────────────────────────────────
       SONG CARDS (list)
    ───────────────────────────────────────── */
    .song-card {
      margin: 0 16px 10px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 16px;
      overflow: hidden; transition: border-color 0.18s; cursor: pointer;
    }
    .song-card:hover { border-color: var(--gold-border); }
    .song-card.featured { border-color: var(--gold-border); }
    .song-card-inner { display: flex; gap: 14px; align-items: center; padding: 16px; }
    .song-cover {
      width: 56px; height: 56px; border-radius: 10px; flex-shrink: 0;
      background: var(--surface-3); overflow: hidden; display: flex;
      align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif; font-weight: 800;
      font-size: 1rem; color: var(--gold);
    }
    .song-cover img { width: 100%; height: 100%; object-fit: cover; }
    .song-info { flex: 1; min-width: 0; }
    .song-title {
      font-family: 'Lora', serif; font-size: 1rem; font-weight: 700;
      color: var(--text); margin-bottom: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .song-artist {
      font-family: 'Lora', serif; font-size: 0.7rem;
      color: var(--text-3); margin-bottom: 8px;
    }
    .song-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .song-tag {
      font-family: 'Lora', serif; font-size: 0.55rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.8px;
      padding: 3px 10px; border-radius: 50px; border: 1px solid;
    }
    .tag-live    { color: var(--success);  border-color: var(--success-border); }
    .tag-coming  { color: var(--gold);     border-color: var(--gold-border); }
    .tag-planned { color: var(--text-3);   border-color: var(--border); }
    .tag-featured { color: var(--gold); border-color: var(--gold-border); background: var(--gold-faint); }

    .section-label {
      font-family: 'Lora', serif; font-size: 0.6rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 2px; color: var(--text-3);
      padding: 0 24px; margin: 32px 0 12px;
    }

    /* Skeleton */
    .sk-card {
      margin: 0 16px 10px; height: 88px; background: var(--surface);
      border-radius: 16px; border: 1px solid var(--border);
      animation: sk-pulse 1.6s ease-in-out infinite;
    }
    @keyframes sk-pulse { 0%,100%{opacity:1} 50%{opacity:0.45} }

    /* Empty state */
    .empty-state { text-align: center; padding: 80px 24px; }
    .empty-state p {
      font-family: 'Lora', serif; font-size: 0.95rem;
      color: var(--text-3); line-height: 1.7;
    }

    /* ─────────────────────────────────────────
       PLAYER OVERLAY — full screen, fixed
    ───────────────────────────────────────── */
    #playerOverlay {
      display: none;
      position: fixed; inset: 0; z-index: 500;
      background: var(--bg);
      flex-direction: column;
      overflow: hidden;
    }
    #playerOverlay.open { display: flex; }

    /* ── Top nav bar ── */
    .player-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      background: rgba(7,6,10,0.97); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--gold-glow);
      flex-shrink: 0; z-index: 10; position: relative;
    }
    .player-back {
      font-family: 'Lora', serif; font-size: 0.7rem; color: var(--text-3);
      background: none; border: none; cursor: pointer; letter-spacing: 1px;
      text-transform: uppercase; transition: color 0.18s;
      min-height: 44px; padding: 0 8px 0 0;
    }
    .player-back:hover { color: var(--gold); }
    .player-song-label {
      font-family: 'Lora', serif; font-size: 0.7rem; font-weight: 600;
      color: var(--text); text-align: right; max-width: 200px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ── Sticky control bar (below nav, above hero) ── */
    .player-controls-bar {
      flex-shrink: 0;
      background: rgba(7,6,10,0.97);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px 10px;
      z-index: 9; position: relative;
    }

    /* Cover + meta row */
    .player-header { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
    .player-cover {
      width: 48px; height: 48px; border-radius: 8px; flex-shrink: 0;
      background: var(--surface-3); overflow: hidden; display: flex;
      align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif; font-weight: 800;
      font-size: 0.9rem; color: var(--gold);
    }
    .player-cover img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
    .player-meta { flex: 1; min-width: 0; }
    .player-title {
      font-family: 'Lora', serif; font-size: 0.9rem; font-weight: 700;
      color: var(--text); margin-bottom: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .player-artist {
      font-family: 'Lora', serif; font-size: 0.65rem; color: var(--text-3);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Platform links */
    .platform-links { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
    .platform-btn {
      font-family: 'Lora', serif; font-size: 0.5rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.8px; padding: 3px 9px;
      border-radius: 50px; border: 1px solid var(--border); color: var(--text-2);
      text-decoration: none; transition: all 0.18s;
      min-height: 24px; display: inline-flex; align-items: center;
    }
    .platform-btn:hover { border-color: var(--gold-border); color: var(--gold); }

    /* Progress */
    .progress-wrap { margin-bottom: 8px; }
    .progress-bar {
      width: 100%; height: 3px; background: var(--surface-3);
      border-radius: 50px; cursor: pointer; margin-bottom: 4px;
      -webkit-appearance: none; appearance: none;
    }
    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      border-radius: 50%; background: var(--gold); cursor: pointer; margin-top: -5.5px;
    }
    .progress-bar::-webkit-slider-runnable-track { height: 3px; border-radius: 50px; }
    .progress-times {
      display: flex; justify-content: space-between;
      font-family: 'Lora', serif; font-size: 0.6rem; color: var(--text-3);
    }

    /* Play/pause row */
    .play-row { display: flex; align-items: center; gap: 12px; }
    .play-btn {
      width: 44px; height: 44px; border-radius: 50%; background: var(--gold);
      border: none; cursor: pointer; display: flex; align-items: center;
      justify-content: center; font-size: 1rem; transition: all 0.18s; flex-shrink: 0;
    }
    .play-btn:hover { background: var(--gold-warm); transform: scale(1.04); }
    .play-btn:active { transform: scale(0.96); }
    .play-status-wrap { flex: 1; min-width: 0; }
    .play-status {
      font-family: 'Lora', serif; font-size: 0.6rem; color: var(--text-3);
      font-style: italic; display: block;
    }

    /* ─────────────────────────────────────────
       SCROLLABLE BODY — hero + lyrics scroll together
       but hero "freezes" via position:sticky
    ───────────────────────────────────────── */
    .player-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    /*
      HERO ZONE — sticky at top of scroll container.
      When user scrolls, lyrics flow up and BEHIND the hero.
      The hero text changes in place — it never moves.
      This is exactly how Apple Music works.
    */
    .hero-zone {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 24px 24px 16px;
      border-bottom: 1px solid var(--border);
      text-align: center;
      /* Subtle gradient so lyrics fade out gracefully behind it */
      background: linear-gradient(
        to bottom,
        var(--bg) 0%,
        var(--bg) 85%,
        rgba(7,6,10,0) 100%
      );
    }

    /* The large italic lyric text — the hero moment */
    .hero-lyric-text {
      font-family: 'Lora', serif;
      font-size: 1.45rem;
      font-style: italic;
      font-weight: 700;
      color: var(--gold);
      line-height: 1.35;
      min-height: 2.2em; /* prevents layout shift when text changes */
      transition: opacity 0.2s cubic-bezier(0.16,1,0.3,1),
                  transform 0.2s cubic-bezier(0.16,1,0.3,1);
      margin-bottom: 14px;
      text-align: center;
    }
    .hero-lyric-text.fading {
      opacity: 0.35;
      transform: translateY(-4px);
    }

    /* Share a Lyric — lives inside hero zone, only visible when line active */
    .share-lyric-btn {
      display: block;
      width: 100%;
      padding: 13px 20px;
      background: var(--gold);
      color: var(--bg);
      border: none;
      border-radius: 12px;
      font-family: 'Lora', serif;
      font-weight: 700;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      min-height: 48px;
      transition: all 0.18s;
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
    }
    .share-lyric-btn:hover { background: var(--gold-warm); }
    .share-lyric-btn:active { transform: translateY(0) scale(0.98); }
    .share-lyric-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    /* ─────────────────────────────────────────
       LYRICS SCROLL AREA — flows up behind hero
    ───────────────────────────────────────── */
    .lyrics-scroll-pad {
      /* Extra top padding so first lyric starts at a comfortable spot */
      padding: 20px 24px 80px;
    }
    .lyrics-label {
      font-family: 'Lora', serif; font-size: 0.6rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 2px; color: var(--text-3);
      margin-bottom: 16px; display: block;
    }
    .lyrics-list { display: flex; flex-direction: column; gap: 0; }

    .lyric-line {
      font-family: 'Lora', serif;
      font-size: 0.95rem;
      font-style: italic;
      color: var(--text-3);
      line-height: 1.7;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.18s;
      border: 1px solid transparent;
      position: relative;
      text-align: center;
    }
    .lyric-line:hover { color: var(--text-2); background: var(--surface-2); }

    /* Active line: full gold, highlighted */
    .lyric-line.active {
      color: var(--gold);
      background: var(--gold-faint);
      border-color: var(--gold-border);
      font-weight: 600;
      font-size: 1rem;
    }

    /* Past lines: dim out */
    .lyric-line.past { opacity: 0.38; }

    /* Active line: centered bottom accent bar */
    .lyric-line.active::after {
      content: '';
      position: absolute;
      bottom: 4px; left: 50%; transform: translateX(-50%);
      width: 32px; height: 2px;
      background: var(--gold);
      border-radius: 2px;
    }

    /* ─────────────────────────────────────────
       COMING SOON / PLANNED state
    ───────────────────────────────────────── */
    .coming-state { text-align: center; padding: 60px 24px; }
    .coming-title {
      font-family: 'Lora', serif; font-size: 1.15rem; font-weight: 700;
      color: var(--text); margin-bottom: 8px;
    }
    .coming-sub {
      font-family: 'Lora', serif; font-size: 0.82rem;
      color: var(--text-3); line-height: 1.6;
    }
    .coming-date {
      display: inline-block; margin-top: 16px;
      font-family: 'Lora', serif; font-size: 0.6rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px;
      color: var(--gold); border: 1px solid var(--gold-border);
      border-radius: 50px; padding: 6px 16px;
    }

    /* ─────────────────────────────────────────
       HIDDEN YOUTUBE — must be in viewport on mobile
    ───────────────────────────────────────── */
    #ytPlayer {
      position: fixed; bottom: 0; left: 0;
      width: 1px; height: 1px;
      opacity: 0; pointer-events: none; z-index: -1;
    }

    /* ─────────────────────────────────────────
       REDUCED MOTION
    ───────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>

<body>
<div class="ambient ambient-1"></div>
<div class="ambient ambient-2"></div>

<!-- ── Song list nav ── -->
<nav>
  <a href="/" class="nav-logo">MARGO</a>
  <a href="/" class="nav-back">← Back</a>
</nav>

<!-- ── Song list ── -->
<div class="page" id="songListPage">
  <div class="page-header">
    <div class="page-eyebrow">Original Music</div>
    <h1 class="page-title">When words fail,<br/>drop a lyric.</h1>
    <p class="page-sub">Songs by Margo. Listen, feel a line, share it.</p>
  </div>
  <div id="songListWrap">
    <div class="sk-card"></div>
    <div class="sk-card" style="opacity:0.6;"></div>
    <div class="sk-card" style="opacity:0.35;"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     PLAYER OVERLAY
══════════════════════════════════════════ -->
<div id="playerOverlay">

  <!-- Fixed top nav -->
  <div class="player-nav">
    <button class="player-back" id="playerBackBtn">← All Songs</button>
    <div class="player-song-label" id="playerSongLabel"></div>
  </div>

  <!-- Fixed controls bar (cover, progress, play) -->
  <div class="player-controls-bar">
    <div class="player-header">
      <div class="player-cover" id="playerCover">M</div>
      <div class="player-meta">
        <div class="player-title" id="playerTitle"></div>
        <div class="player-artist" id="playerArtist"></div>
        <div class="platform-links" id="platformLinks"></div>
      </div>
    </div>

    <div class="progress-wrap" id="progressWrap" style="display:none;">
      <input type="range" class="progress-bar" id="progressBar"
        min="0" max="100" value="0" step="0.1"/>
      <div class="progress-times">
        <span id="timeElapsed">0:00</span>
        <span id="timeDuration">0:00</span>
      </div>
    </div>

    <div class="play-row">
      <button class="play-btn" id="playBtn" aria-label="Play">▶</button>
      <div class="play-status-wrap">
        <span class="play-status" id="playStatus">Tap to play</span>
      </div>
    </div>
  </div>

  <!-- Scrollable body: hero is sticky inside here, lyrics flow below it -->
  <div class="player-body" id="playerBody">

    <!--
      HERO ZONE — sticky within the scroll container.
      Lyrics scroll up and disappear behind it.
      Hero text updates in place — it never moves.
    -->
    <div class="hero-zone" id="heroZone" style="display:none;">
      <div class="hero-lyric-text" id="heroLyricText">&nbsp;</div>
      <button class="share-lyric-btn" id="shareLyricBtn">+ Share a Lyric</button>
    </div>

    <!-- Lyrics list (scrolls up behind hero) -->
    <div class="lyrics-scroll-pad" id="lyricsScrollPad">
      <!-- filled by JS -->
    </div>

  </div>
</div>

<!-- YouTube iframe anchor (must be in viewport on mobile) -->
<div id="ytPlayer"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<!--
  share-sheet.js — loaded dynamically when player opens.
  It lives at /js/media/share-sheet.js on the real site.
  We load it lazily so the song list page doesn't pay the cost.
-->

<script>
/* ============================================================
   music.js — inline
   ============================================================ */

let _songs         = [];
let _activeSong    = null;
let _ytPlayer      = null;
let _ytReady       = false;
let _syncInterval  = null;
let _lyricsJson    = [];
let _activeLineIdx = -1;
let _isPlaying     = false;
let _duration      = 0;
let _shareSheetLoaded = false;
let _lastHeroText  = '';

/* ── Firebase boot ── */
async function initMusicFirebase() {
  try {
    const res = await fetch('/api/config');
    if (!res.ok) throw new Error('Config failed');
    const cfg = await res.json();
    firebase.initializeApp(cfg);
    loadSongs();
  } catch(e) {
    console.warn('[Music] Firebase init failed:', e.message);
    showEmptyState('Could not connect. Please refresh.');
  }
}

/* ── Normalise — handles both old and new schema ── */
function _normaliseSong(s) {
  if (s.status === 'active') s.status = 'live';
  if (!s.lyricsJson && s.srt) s.lyricsJson = parseLyrics(s.srt);
  if (s.featured === undefined && s.order === 1) s.featured = true;
  return s;
}

/* ── Load songs ── */
function loadSongs() {
  firebase.database().ref('songs').once('value')
    .then(snap => {
      _songs = [];
      snap.forEach(child => {
        const s = _normaliseSong(child.val());
        s.id = child.key;
        _songs.push(s);
      });
      _songs.sort((a, b) => (a.order || 99) - (b.order || 99));
      renderSongList();
    })
    .catch(() => showEmptyState('Could not load songs.'));
}

/* ── Render list ── */
function renderSongList() {
  const wrap = document.getElementById('songListWrap');
  if (!wrap) return;
  wrap.innerHTML = '';

  if (!_songs.length) { showEmptyState('Music coming soon.'); return; }

  const featured = _songs.find(s => s.featured && s.status === 'live')
                || _songs.find(s => s.status === 'live');
  const rest = _songs.filter(s => s !== featured);

  if (featured) wrap.appendChild(_buildSongCard(featured, true));

  const live    = rest.filter(s => s.status === 'live');
  const coming  = rest.filter(s => s.status === 'coming');
  const planned = rest.filter(s => s.status === 'planned');

  if (live.length) {
    if (featured) {
      const lbl = document.createElement('div');
      lbl.className = 'section-label';
      lbl.textContent = 'More Songs';
      wrap.appendChild(lbl);
    }
    live.forEach(s => wrap.appendChild(_buildSongCard(s, false)));
  }

  if (coming.length) {
    const lbl = document.createElement('div');
    lbl.className = 'section-label';
    lbl.textContent = 'Coming Soon';
    wrap.appendChild(lbl);
    coming.forEach(s => wrap.appendChild(_buildSongCard(s, false)));
  }

  if (planned.length) {
    const lbl = document.createElement('div');
    lbl.className = 'section-label';
    lbl.textContent = 'In the Works';
    wrap.appendChild(lbl);
    planned.forEach(s => wrap.appendChild(_buildSongCard(s, false)));
  }
}

function _buildSongCard(song, isFeatured) {
  const card = document.createElement('div');
  card.className = 'song-card' + (isFeatured ? ' featured' : '');

  const statusTag = song.status === 'live'
    ? '<span class="song-tag tag-live">Live</span>'
    : song.status === 'coming'
    ? '<span class="song-tag tag-coming">Coming Soon</span>'
    : '<span class="song-tag tag-planned">In the Works</span>';

  const featTag = isFeatured
    ? '<span class="song-tag tag-featured">Featured</span>'
    : '';

  card.innerHTML = `
    <div class="song-card-inner">
      <div class="song-cover">
        ${song.coverUrl
          ? `<img src="${song.coverUrl}" alt="${song.title}" onerror="this.parentNode.textContent='M'"/>`
          : 'M'}
      </div>
      <div class="song-info">
        <div class="song-title">${song.title || 'Untitled'}</div>
        <div class="song-artist">${song.artist || 'Margo'}${song.releaseDate ? ' · ' + song.releaseDate : ''}</div>
        <div class="song-tags">${statusTag}${featTag}</div>
      </div>
    </div>
  `;

  card.onclick = () => openPlayer(song);
  return card;
}

function showEmptyState(msg) {
  const wrap = document.getElementById('songListWrap');
  if (wrap) wrap.innerHTML = `<div class="empty-state"><p>${msg}</p></div>`;
}

/* ══════════════════════════════════════
   PLAYER
══════════════════════════════════════ */
function openPlayer(song) {
  _activeSong    = song;
  _lyricsJson    = Array.isArray(song.lyricsJson) ? song.lyricsJson : [];
  _activeLineIdx = -1;
  _isPlaying     = false;
  _lastHeroText  = '';

  // Lazy-load share-sheet.js
  _ensureShareSheet();

  // Nav label
  const label = document.getElementById('playerSongLabel');
  if (label) label.textContent = song.title || '';

  // Cover
  const coverEl = document.getElementById('playerCover');
  if (coverEl) {
    coverEl.innerHTML = song.coverUrl
      ? `<img src="${song.coverUrl}" alt="${song.title}" onerror="this.parentNode.textContent='M'"/>`
      : 'M';
  }

  // Title / artist
  const titleEl  = document.getElementById('playerTitle');
  const artistEl = document.getElementById('playerArtist');
  if (titleEl)  titleEl.textContent  = song.title  || '';
  if (artistEl) artistEl.textContent = (song.artist || 'Margo') + (song.releaseDate ? ' · ' + song.releaseDate : '');

  // Platform links
  _renderPlatformLinks(song);

  // Progress bar
  const progressWrap = document.getElementById('progressWrap');
  if (progressWrap) progressWrap.style.display = song.youtubeId ? 'block' : 'none';

  // Reset controls
  _setPlayBtn(false);
  const ps = document.getElementById('playStatus');
  if (ps) ps.textContent = song.youtubeId ? 'Tap to play' : '';

  // Build lyrics UI
  _renderPlayerBody(song);

  // Show overlay
  const overlay = document.getElementById('playerOverlay');
  if (overlay) overlay.classList.add('open');
  document.body.style.overflow = 'hidden';

  // Scroll to top
  const body = document.getElementById('playerBody');
  if (body) body.scrollTop = 0;

  // Wire buttons
  const backBtn = document.getElementById('playerBackBtn');
  if (backBtn) backBtn.onclick = closePlayer;

  const playBtn = document.getElementById('playBtn');
  if (playBtn) playBtn.onclick = togglePlay;

  const progressBar = document.getElementById('progressBar');
  if (progressBar) {
    progressBar.oninput = e => {
      if (_ytPlayer && _ytReady && _duration) {
        _ytPlayer.seekTo((e.target.value / 100) * _duration, true);
      }
    };
  }

  const shareBtn = document.getElementById('shareLyricBtn');
  if (shareBtn) shareBtn.onclick = _shareActiveLyric;

  // Init YouTube
  if (song.youtubeId) _initYT(song.youtubeId);
}

function closePlayer() {
  const overlay = document.getElementById('playerOverlay');
  if (overlay) overlay.classList.remove('open');
  document.body.style.overflow = '';
  _stopSync();
  if (_ytPlayer && _ytReady) { try { _ytPlayer.stopVideo(); } catch(e) {} }
  _isPlaying = false;
  _setPlayBtn(false);
}

/* ── Platform links ── */
function _renderPlatformLinks(song) {
  const wrap = document.getElementById('platformLinks');
  if (!wrap) return;
  wrap.innerHTML = '';
  const p = song.platforms || {};
  const defs = [
    { key:'youtube',    label:'YouTube'    },
    { key:'audiomack',  label:'Audiomack'  },
    { key:'boomplay',   label:'Boomplay'   },
    { key:'soundcloud', label:'SoundCloud' },
    { key:'spotify',    label:'Spotify'    },
    { key:'apple',      label:'Apple Music'},
  ];
  defs.forEach(({ key, label }) => {
    const url = p[key];
    if (!url) return;
    const a = document.createElement('a');
    a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.className = 'platform-btn';
    a.textContent = label;
    wrap.appendChild(a);
  });
}

/* ── Render player body ── */
function _renderPlayerBody(song) {
  const heroZone = document.getElementById('heroZone');
  const pad      = document.getElementById('lyricsScrollPad');
  if (!heroZone || !pad) return;

  pad.innerHTML = '';

  if (song.status === 'coming' || song.status === 'planned') {
    heroZone.style.display = 'none';
    pad.innerHTML = `
      <div class="coming-state">
        <div class="coming-title">${song.title}</div>
        <div class="coming-sub">This song is on its way.<br/>Follow along on the feed when it drops.</div>
        ${song.releaseDate ? `<span class="coming-date">Dropping ${song.releaseDate}</span>` : ''}
      </div>`;
    return;
  }

  if (!_lyricsJson.length) {
    heroZone.style.display = 'none';
    pad.innerHTML = `<div style="padding:40px 0;text-align:center;
      font-family:'Lora',serif;font-size:0.82rem;color:var(--text-3);font-style:italic;">
      Lyrics coming soon</div>`;
    return;
  }

  // Show hero zone
  heroZone.style.display = 'block';

  // Reset hero
  const heroText = document.getElementById('heroLyricText');
  if (heroText) { heroText.textContent = '\u00a0'; heroText.classList.remove('fading'); }
  const shareBtn = document.getElementById('shareLyricBtn');
  if (shareBtn) shareBtn.classList.remove('visible');

  // Build lyrics list
  const label = document.createElement('span');
  label.className = 'lyrics-label';
  label.textContent = 'Full Lyrics — tap any line to jump';
  pad.appendChild(label);

  const list = document.createElement('div');
  list.className = 'lyrics-list';
  list.id = 'lyricsList';

  _lyricsJson.forEach((line, i) => {
    const el = document.createElement('div');
    el.className = 'lyric-line';
    el.dataset.idx = i;
    el.textContent = line.text;
    el.onclick = () => {
      if (_ytPlayer && _ytReady) {
        _ytPlayer.seekTo(line.start, true);
        if (!_isPlaying) _ytPlayer.playVideo();
      }
    };
    list.appendChild(el);
  });

  pad.appendChild(list);
}

/* ── Share active lyric → opens existing share-sheet ── */
function _shareActiveLyric() {
  if (_activeLineIdx < 0 || !_lyricsJson[_activeLineIdx]) return;
  const line = _lyricsJson[_activeLineIdx];
  const song = _activeSong;

  const fakePost = {
    text: line.text,
    knowledge: {
      song:   song?.title  || '',
      artist: song?.artist || 'Margo',
    },
    emotion:   'Nostalgia',
    feeling:   'Nostalgia',
    timestamp: Date.now(),
  };

  // If share sheet already loaded, open immediately
  if (typeof window.openShareSheet === 'function') {
    window.openShareSheet(fakePost, { context: `From: ${song?.title || 'Margo'}` });
    return;
  }

  // Not loaded yet — ensure load then poll until ready
  _ensureShareSheet();
  let tries = 0;
  const poll = setInterval(() => {
    tries++;
    if (typeof window.openShareSheet === 'function') {
      clearInterval(poll);
      window.openShareSheet(fakePost, { context: `From: ${song?.title || 'Margo'}` });
    } else if (tries > 60) {
      clearInterval(poll);
      // Hard fallback
      const encoded    = encodeURIComponent(line.text);
      const song_enc   = encodeURIComponent(song?.title  || '');
      const artist_enc = encodeURIComponent(song?.artist || 'Margo');
      window.location.href = `/?sharelyric=${encoded}&song=${song_enc}&artist=${artist_enc}`;
    }
  }, 100);
}

/* ── Lazy-load full export chain (mirrors index.html load order) ── */
function _ensureShareSheet() {
  if (_shareSheetLoaded) return;
  _shareSheetLoaded = true;

  // CSS
  const css = document.createElement('link');
  css.rel = 'stylesheet'; css.href = '/assets/gif-studio.css';
  document.head.appendChild(css);

  // Minimal showToast so share-sheet doesn't silently crash
  if (typeof window.showToast !== 'function') {
    window.showToast = function(msg) {
      const t = document.createElement('div');
      t.textContent = msg;
      t.style.cssText = 'position:fixed;bottom:32px;left:50%;transform:translateX(-50%);' +
        'background:#1a1a1a;color:#F4F1ED;font-family:Lora,serif;font-size:0.75rem;' +
        'padding:10px 20px;border-radius:50px;border:1px solid rgba(255,255,255,0.1);' +
        'z-index:9999;pointer-events:none;';
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2800);
    };
  }

  // Load scripts in the exact order index.html uses
  const chain = [
    '/js/media/gif/renderer.js',
    '/js/media/gif/exporter.js',
    '/js/core/brand.js',
    '/js/media/gif/gif-studio.js',
    '/js/media/poster/renderer.js',
    '/js/media/poster/exporter.js',
    '/js/media/poster/studio.js',
    '/js/media/share-sheet.js',
    '/js/features/duet-mode.js',
  ];

  function _loadNext(i) {
    if (i >= chain.length) return;
    const s = document.createElement('script');
    s.src = chain[i];
    s.onload = () => _loadNext(i + 1);
    s.onerror = () => _loadNext(i + 1); // skip broken, keep going
    document.body.appendChild(s);
  }
  _loadNext(0);
}

/* ══════════════════════════════════════
   YOUTUBE
══════════════════════════════════════ */
function _initYT(videoId) {
  _ytReady = false;
  _stopSync();

  if (window.YT && window.YT.Player) {
    _createYTPlayer(videoId);
    return;
  }
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
  window.onYouTubeIframeAPIReady = () => _createYTPlayer(videoId);
}

function _createYTPlayer(videoId) {
  if (_ytPlayer) { try { _ytPlayer.destroy(); } catch(e) {} _ytPlayer = null; }
  const container = document.getElementById('ytPlayer');
  if (container) container.innerHTML = '<div id="ytPlayerInner"></div>';

  _ytPlayer = new YT.Player('ytPlayerInner', {
    videoId,
    width: '1', height: '1',
    playerVars: {
      autoplay: 0, controls: 0, disablekb: 1, fs: 0,
      modestbranding: 1, rel: 0, playsinline: 1,
      origin: window.location.origin,
    },
    events: {
      onReady:       () => { _ytReady = true; _duration = _ytPlayer.getDuration() || 0; _updateDurationDisplay(); },
      onStateChange: e  => _onYTStateChange(e),
    }
  });
}

function _onYTStateChange(e) {
  const YTS = YT.PlayerState;
  if (e.data === YTS.PLAYING) {
    _isPlaying = true;
    _setPlayBtn(true);
    _duration = _ytPlayer.getDuration() || 0;
    _updateDurationDisplay();
    _startSync();
    const ps = document.getElementById('playStatus');
    if (ps) ps.textContent = 'Now playing';
  } else if (e.data === YTS.PAUSED || e.data === YTS.ENDED) {
    _isPlaying = false;
    _setPlayBtn(false);
    _stopSync();
    const ps = document.getElementById('playStatus');
    if (ps) ps.textContent = e.data === YTS.ENDED ? 'Ended' : 'Paused';
  }
}

function togglePlay() {
  if (!_ytPlayer || !_ytReady) {
    const url = _activeSong?.platforms?.youtube
      || (_activeSong?.youtubeId ? `https://www.youtube.com/watch?v=${_activeSong.youtubeId}` : null);
    if (url) window.open(url, '_blank');
    return;
  }
  if (_isPlaying) _ytPlayer.pauseVideo();
  else            _ytPlayer.playVideo();
}

function _setPlayBtn(playing) {
  const btn = document.getElementById('playBtn');
  if (btn) btn.textContent = playing ? '⏸' : '▶';
}

/* ── Sync loop ── */
function _startSync() {
  _stopSync();
  _syncInterval = setInterval(_syncLyrics, 100);
}

function _stopSync() {
  if (_syncInterval) { clearInterval(_syncInterval); _syncInterval = null; }
}

function _syncLyrics() {
  if (!_ytPlayer || !_ytReady || !_lyricsJson.length) return;
  let t;
  try { t = _ytPlayer.getCurrentTime() || 0; } catch(e) { return; }

  // Progress bar
  const bar = document.getElementById('progressBar');
  if (bar && _duration) bar.value = (t / _duration) * 100;
  const el = document.getElementById('timeElapsed');
  if (el) el.textContent = _fmtTime(t);

  // Find active line (strict: must be inside start → end)
  let newIdx = -1;
  for (let i = 0; i < _lyricsJson.length; i++) {
    if (t >= _lyricsJson[i].start && t < _lyricsJson[i].end) {
      newIdx = i;
      break;
    }
  }

  if (newIdx === _activeLineIdx) return;
  _activeLineIdx = newIdx;
  _updateLyricsUI(newIdx);
}

function _updateLyricsUI(idx) {
  const heroText = document.getElementById('heroLyricText');
  const shareBtn = document.getElementById('shareLyricBtn');

  // ── Hero update ──
  if (heroText) {
    if (idx >= 0 && _lyricsJson[idx]) {
      const newText = _lyricsJson[idx].text;
      if (newText !== _lastHeroText) {
        _lastHeroText = newText;
        // Fade out → change → fade in
        heroText.classList.add('fading');
        setTimeout(() => {
          heroText.textContent = newText;
          heroText.classList.remove('fading');
        }, 200);
      }
    }
    // idx === -1: gap between lines — keep last text, just dim it
    if (idx === -1) {
      heroText.style.opacity = '0.38';
    } else {
      heroText.style.opacity = '';
    }
  }

  // ── Share button: visible only when a line is active ──
  if (shareBtn) shareBtn.classList.toggle('visible', idx >= 0);

  // ── Lyrics list: active / past classes ──
  const lines = document.querySelectorAll('.lyric-line');
  lines.forEach(el => {
    const i = parseInt(el.dataset.idx, 10);
    el.classList.toggle('active', i === idx);
    el.classList.toggle('past',   i <  idx);
  });

  // ── Auto-scroll active line to a comfortable reading position ──
  if (idx >= 0) {
    const activeLine = document.querySelector('.lyric-line.active');
    if (activeLine) {
      activeLine.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
}

function _updateDurationDisplay() {
  const dur = document.getElementById('timeDuration');
  if (dur && _duration) dur.textContent = _fmtTime(_duration);
}

function _fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

/* ══════════════════════════════════════
   LYRIC PARSERS
══════════════════════════════════════ */
function parseLyrics(raw) {
  if (!raw || !raw.trim()) return [];
  const text = raw.trim();
  if (/\d{2}:\d{2}:\d{2},\d{3}\s*-->\s*\d{2}:\d{2}:\d{2},\d{3}/.test(text)) return _parseSRT(text);
  if (/\[\d{2}:\d{2}[.:]\d{2,3}\]/.test(text)) return _parseLRC(text);
  return [];
}
function _srtTimeToSec(ts) {
  const [hms, ms] = ts.trim().split(',');
  const [h, m, s] = hms.split(':').map(Number);
  return h * 3600 + m * 60 + s + (parseInt(ms || '0', 10) / 1000);
}
function _parseSRT(text) {
  const lines = [];
  const blocks = text.split(/\n\s*\n/);
  for (const block of blocks) {
    const rows = block.trim().split('\n');
    const tsRow = rows.find(r => r.includes('-->'));
    if (!tsRow) continue;
    const [startStr, endStr] = tsRow.split('-->');
    const start = _srtTimeToSec(startStr);
    const end   = _srtTimeToSec(endStr);
    const tsIdx = rows.indexOf(tsRow);
    const lyricText = rows.slice(tsIdx + 1).filter(r => r.trim()).join(' ').trim();
    if (lyricText && !isNaN(start)) lines.push({ start, end, text: lyricText });
  }
  return lines;
}
function _parseLRC(text) {
  const lines = []; const parsed = [];
  for (const row of text.split('\n')) {
    const match = row.match(/^(\[\d{2}:\d{2}[.:]\d{2,3}\])\s*(.*)$/);
    if (!match) continue;
    const clean = match[1].replace(/[\[\]]/g, '');
    const [mStr, sStr] = clean.split(':');
    const start = parseInt(mStr, 10) * 60 + parseFloat(sStr);
    const t = match[2].trim();
    if (t && !t.startsWith('[')) parsed.push({ start, text: t });
  }
  for (let i = 0; i < parsed.length; i++) {
    lines.push({
      start: parsed[i].start,
      end:   parsed[i + 1] ? parsed[i + 1].start : parsed[i].start + 5,
      text:  parsed[i].text,
    });
  }
  return lines;
}

/* ── Boot ── */
initMusicFirebase();
