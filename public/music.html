<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Music — Margo</title>
  <meta name="description" content="Original music by Margo. Listen, read every lyric, and share the lines that say what you couldn't."/>
  <meta property="og:type" content="website"/>
  <meta property="og:site_name" content="MARGO"/>
  <meta property="og:title" content="Music — Margo"/>
  <meta property="og:url" content="https://trymargo.com/music"/>
  <meta property="og:image" content="https://trymargo.com/og-image.png"/>
  <link rel="canonical" href="https://trymargo.com/music"/>
  <link rel="icon" href="/favicons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicons/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/favicons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/base.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      overflow-x: hidden;
    }

    /* ── NAV ── */
    .site-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 0px) + 14px) 24px 14px;
      border-bottom: 1px solid var(--gold-glow);
      position: sticky; top: 0; z-index: 100;
      background: rgba(7,6,10,0.94); backdrop-filter: blur(20px);
    }
    .nav-logo {
      display: flex; align-items: center; gap: 8px;
      text-decoration: none;
    }
    /* ── Margo mark (matches landing.css exactly) ── */
    .margo-mark { position:relative; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .margo-mark--lg { width:30px; height:30px; }
    .margo-mark .logo-circle { position:relative; z-index:2; border-radius:50%; display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; animation:core-breathe 3.4s ease-in-out infinite; }
    .margo-mark .logo-circle svg { width:100%; height:100%; display:block; }
    .margo-mark--lg .logo-circle { width:26px; height:26px; filter:drop-shadow(0 0 8px rgba(232,197,71,0.8)); }
    @keyframes core-breathe { 0%,100%{filter:drop-shadow(0 0 6px rgba(232,197,71,0.6))} 50%{filter:drop-shadow(0 0 18px rgba(232,197,71,1.0))} }
    .margo-mark .logo-ring { position:absolute; border-radius:50%; border:1px solid rgba(232,197,71,0.65); animation:nav-ripple 3.4s ease-out infinite; }
    .margo-mark--lg .logo-ring { width:26px; height:26px; border-width:1.5px; }
    .margo-mark .logo-ring:nth-child(1) { animation-delay:0s; }
    .margo-mark .logo-ring:nth-child(2) { animation-delay:1.1s; }
    .margo-mark .logo-ring:nth-child(3) { animation-delay:2.2s; }
    @keyframes nav-ripple { 0%{transform:scale(0.55);opacity:1;border-color:rgba(232,197,71,0.7)} 100%{transform:scale(2.8);opacity:0;border-color:rgba(232,197,71,0)} }
    .nav-logo-text {
      font-family: 'Syne', sans-serif; font-weight: 800;
      font-size: 0.88rem; letter-spacing: 4px;
      color: var(--gold); text-transform: uppercase;
    }
    .nav-link {
      font-family: 'Lora', serif; font-size: 0.65rem;
      color: var(--text-3); text-decoration: none;
      letter-spacing: 1px; text-transform: uppercase;
      transition: color 0.15s;
    }
    .nav-link:hover { color: var(--gold); }

    /* ── SONG LIST PAGE ── */
    .list-page {
      max-width: 560px; margin: 0 auto;
      padding: 0 0 100px; position: relative; z-index: 1;
    }

    /* Hero header */
    .list-hero {
      padding: 48px 24px 32px;
      border-bottom: 1px solid var(--border);
    }
    .list-eyebrow {
      font-family: 'Lora', serif; font-size: 0.6rem; font-weight: 600;
      letter-spacing: 2.5px; text-transform: uppercase;
      color: var(--gold); margin-bottom: 12px; display: block;
    }
    .list-title {
      font-family: 'Lora', serif; font-size: 1.6rem; font-weight: 700;
      color: var(--text); line-height: 1.2; margin: 0 0 10px;
    }
    .list-sub {
      font-family: 'Lora', serif; font-size: 0.82rem;
      color: var(--text-3); line-height: 1.6; margin: 0;
    }

    /* ── FEATURED SONG — big card ── */
    .featured-card {
      margin: 24px 16px 0;
      border-radius: 20px;
      border: 1px solid var(--gold-border);
      background: var(--surface);
      overflow: hidden; cursor: pointer;
      transition: transform 0.18s, border-color 0.18s;
      position: relative;
    }
    .featured-card:hover { transform: translateY(-2px); border-color: var(--gold); }
    .featured-card:active { transform: translateY(0); }

    .featured-cover-wrap {
      width: 100%; aspect-ratio: 16/7;
      background: var(--surface-3);
      overflow: hidden; position: relative;
    }
    .featured-cover-wrap img {
      width: 100%; height: 100%; object-fit: cover;
      display: block;
    }
    .featured-cover-fallback {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--surface-3) 0%, #1a1628 100%);
    }
    .featured-cover-fallback span {
      font-family: 'Syne', sans-serif; font-weight: 800;
      font-size: 3rem; color: var(--gold); opacity: 0.3; letter-spacing: 4px;
    }
    /* Gradient overlay on cover */
    .featured-cover-wrap::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to bottom, transparent 30%, rgba(7,6,10,0.9) 100%);
    }
    .featured-badge {
      position: absolute; top: 14px; left: 14px; z-index: 2;
      font-family: 'Lora', serif; font-size: 0.55rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px;
      color: var(--gold); border: 1px solid var(--gold-border);
      background: rgba(7,6,10,0.8); backdrop-filter: blur(8px);
      border-radius: 50px; padding: 4px 12px;
    }

    .featured-body { padding: 16px 20px 20px; }
    .featured-title {
      font-family: 'Lora', serif; font-size: 1.15rem; font-weight: 700;
      color: var(--text); margin-bottom: 4px;
    }
    .featured-meta {
      font-family: 'Lora', serif; font-size: 0.7rem;
      color: var(--text-3); margin-bottom: 14px;
    }
    .featured-cta {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: 'Lora', serif; font-size: 0.65rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px;
      color: var(--bg); background: var(--gold);
      border: none; border-radius: 10px;
      padding: 10px 20px; cursor: pointer;
      min-height: 44px; transition: all 0.15s;
    }
    .featured-cta:hover { background: var(--gold-warm); }

    /* ── SECTION LABEL ── */
    .section-label {
      font-family: 'Lora', serif; font-size: 0.6rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 2px; color: var(--text-3);
      padding: 0 20px; margin: 32px 0 12px; display: block;
    }

    /* ── SONG GRID — 2 columns ── */
    .song-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; padding: 0 16px;
    }
    .song-grid-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden; cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
    }
    .song-grid-card:hover { border-color: var(--gold-border); transform: translateY(-1px); }
    .song-grid-card:active { transform: translateY(0); }
    .song-grid-card.coming { opacity: 0.65; cursor: default; }

    .grid-cover {
      width: 100%; aspect-ratio: 1/1;
      background: var(--surface-3); overflow: hidden;
      position: relative; display: flex;
      align-items: center; justify-content: center;
    }
    .grid-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .grid-cover-letter {
      font-family: 'Syne', sans-serif; font-weight: 800;
      font-size: 1.8rem; color: var(--gold); opacity: 0.25;
    }
    .grid-lock {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(7,6,10,0.55);
      font-size: 1.2rem;
    }
    .grid-info { padding: 10px 12px 12px; }
    .grid-title {
      font-family: 'Lora', serif; font-size: 0.82rem; font-weight: 700;
      color: var(--text); line-height: 1.3; margin-bottom: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .grid-artist {
      font-family: 'Lora', serif; font-size: 0.6rem;
      color: var(--text-3); margin-bottom: 6px;
    }
    .grid-tag {
      font-family: 'Lora', serif; font-size: 0.52rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.8px;
      padding: 2px 8px; border-radius: 50px; border: 1px solid;
      display: inline-block;
    }
    .tag-live    { color: var(--success);  border-color: rgba(74,222,128,0.3); }
    .tag-coming  { color: var(--gold);     border-color: var(--gold-border); }
    .tag-planned { color: var(--text-3);   border-color: var(--border); }

    /* Skeleton */
    .sk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px; }
    .sk-item {
      border-radius: 14px; background: var(--surface);
      border: 1px solid var(--border);
      animation: skpulse 1.6s ease-in-out infinite;
    }
    .sk-item::before { content: ''; display: block; aspect-ratio: 1/1; }
    .sk-item-body { height: 62px; border-top: 1px solid var(--border); }
    @keyframes skpulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* ── PLAYER OVERLAY ── */
    #playerOverlay {
      display: none; position: fixed; inset: 0; z-index: 500;
      flex-direction: column; overflow: hidden; /* shell never scrolls */
      background: var(--bg);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    #playerOverlay.open { display: flex; }
    /* Force body to not scroll when overlay is open */
    body.player-open { overflow: hidden; position: fixed; width: 100%; }
    /* Atmospheric background — blurred cover art fills screen */
    .player-bg {
      position: absolute; inset: 0; z-index: 0;
      background-size: cover; background-position: center;
      filter: blur(60px) saturate(1.4);
      opacity: 0.12;
      transform: scale(1.1);
      transition: opacity 0.6s;
    }
    /* Emotion ambient layer */
    .player-emotion-glow {
      position: absolute; inset: 0; z-index: 0;
      pointer-events: none;
      transition: background 1.2s ease;
    }

    /* ── Player nav — FROZEN at top, never scrolls ── */
    .player-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 510;
      display: flex; align-items: center; justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 0px) + 14px) 20px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(7,6,10,0.94); backdrop-filter: blur(24px);
      box-sizing: border-box;
    }
    .player-nav-logo { display: none; }
    /* Push content below the frozen nav */
    .player-nav-spacer {
      height: calc(env(safe-area-inset-top, 0px) + 60px);
      flex-shrink: 0;
    }
    .player-back-btn {
      font-family: 'Lora', serif; font-size: 0.65rem;
      color: var(--text-2); background: none; border: none;
      cursor: pointer; letter-spacing: 1px; text-transform: uppercase;
      min-height: 44px; padding: 0 8px 0 0; transition: color 0.15s;
    }
    .player-back-btn:hover { color: var(--gold); }
    .player-now-playing {
      font-family: 'Lora', serif; font-size: 0.6rem;
      color: var(--text-3); font-style: italic; letter-spacing: 0.5px;
    }

    /* ── Player controls strip ── */
    .player-strip {
      flex-shrink: 0; position: fixed; top: 56px; left: 0; right: 0; z-index: 505;
      background: rgba(7,6,10,0.82); backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 14px 20px 12px;
    }
    .strip-top { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }

    /* Large cover art */
    .strip-cover {
      width: 56px; height: 56px; border-radius: 10px; flex-shrink: 0;
      background: var(--surface-3); overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif; font-weight: 800;
      font-size: 1.1rem; color: var(--gold);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .strip-cover img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }

    .strip-meta { flex: 1; min-width: 0; }
    .strip-title {
      font-family: 'Lora', serif; font-size: 0.95rem; font-weight: 700;
      color: var(--text); margin-bottom: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .strip-artist {
      font-family: 'Lora', serif; font-size: 0.65rem;
      color: var(--text-3); margin-bottom: 6px;
    }

    /* Platform links */
    .strip-platforms { display: flex; gap: 5px; flex-wrap: wrap; }
    .plat-btn {
      font-family: 'Lora', serif; font-size: 0.52rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.8px;
      padding: 3px 10px; border-radius: 50px;
      border: 1px solid var(--border); color: var(--text-3);
      text-decoration: none; transition: all 0.15s;
      min-height: 22px; display: inline-flex; align-items: center;
    }
    .plat-btn:hover { border-color: var(--gold-border); color: var(--gold); }

    /* Progress */
    .strip-progress { margin-bottom: 10px; }
    .progress-track {
      width: 100%; height: 3px; background: rgba(255,255,255,0.1);
      border-radius: 50px; cursor: pointer; margin-bottom: 5px;
      -webkit-appearance: none; appearance: none;
      accent-color: var(--gold);
    }
    .progress-track::-webkit-slider-thumb {
      -webkit-appearance: none; width: 13px; height: 13px;
      border-radius: 50%; background: var(--gold);
      cursor: pointer; margin-top: -5px;
    }
    .progress-track::-webkit-slider-runnable-track {
      height: 3px; border-radius: 50px;
    }
    .progress-times {
      display: flex; justify-content: space-between;
      font-family: 'Lora', serif; font-size: 0.58rem; color: var(--text-3);
    }

    /* Play row */
    .strip-play-row { display: flex; align-items: center; gap: 14px; }
    .big-play-btn {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--gold); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; flex-shrink: 0;
      transition: all 0.15s;
      box-shadow: 0 4px 16px rgba(232,197,71,0.35);
    }
    .big-play-btn:hover { background: var(--gold-warm); transform: scale(1.06); box-shadow: 0 6px 24px rgba(232,197,71,0.45); }
    .big-play-btn:active { transform: scale(0.95); }
    .play-state-wrap { flex: 1; min-width: 0; }
    .play-state-text {
      font-family: 'Lora', serif; font-size: 0.62rem;
      color: var(--text-3); font-style: italic; display: block;
    }
    .play-state-hint {
      font-family: 'Lora', serif; font-size: 0.58rem;
      color: var(--text-3); opacity: 0.55; display: block; margin-top: 1px;
    }

    .hero-spacer { height: 24px; flex-shrink: 0; pointer-events: none; }
    /* ── Scrollable player body ── */
    .player-body {
      flex: 1; overflow: hidden; display: flex; flex-direction: column; padding-top: 160px;
      -webkit-overflow-scrolling: touch;
      position: relative; z-index: 5;
    }

    /* ── Hero zone — sticky, lyric freezes here ── */
    .hero-zone {
      flex-shrink: 0; z-index: 6;
      padding: 28px 28px 20px;
      text-align: center;
      background: linear-gradient(to bottom, var(--bg) 0%, var(--bg) 80%, rgba(7,6,10,0) 100%);
      border-bottom: none;
    }

    /* Lyric number / position indicator */
    .hero-counter {
      font-family: 'Lora', serif; font-size: 0.55rem;
      color: var(--text-3); letter-spacing: 2px;
      text-transform: uppercase; margin-bottom: 14px;
      display: block; opacity: 0;
      transition: opacity 0.3s;
    }
    .hero-counter.visible { opacity: 1; }

    /* The lyric itself */
    .hero-lyric {
      font-family: 'Lora', serif;
      font-size: 1.4rem; font-style: italic; font-weight: 700;
      color: var(--gold); line-height: 1.4;
      min-height: 0;
      margin-bottom: 16px;
      /* Float-up transition */
      transition: opacity 0.25s cubic-bezier(0.16,1,0.3,1),
                  transform 0.25s cubic-bezier(0.16,1,0.3,1);
    }
    .hero-lyric.out {
      opacity: 0;
      transform: translateY(-8px);
    }
    .hero-lyric.in {
      opacity: 1;
      transform: translateY(0);
    }
    /* Gap state — dims, doesn't disappear */
    .hero-lyric.gap { opacity: 0.3; transform: translateY(0); }

    /* Share button — always visible, dims between lyrics */
    .share-lyric-btn {
      width: 100%; padding: 11px 20px;
      background: transparent;
      border: 1px solid rgba(232,197,71,0.25);
      border-radius: 12px;
      color: rgba(232,197,71,0.3);
      font-family: 'Lora', serif; font-weight: 700;
      font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1px;
      cursor: default; min-height: 44px;
      transition: all 0.3s ease;
      pointer-events: none;
    }
    .share-lyric-btn:hover { background: var(--gold-warm); color: var(--bg); }
    .share-lyric-btn:active { transform: scale(0.98); }
    .share-lyric-btn.visible {
      background: var(--gold); color: var(--bg);
      border-color: var(--gold);
      pointer-events: auto; cursor: pointer;
      box-shadow: 0 4px 16px rgba(232,197,71,0.25);
    }

    /* ── Lyrics list ── */
    .lyrics-pad { flex: 1; overflow-y: auto; min-height: 0; padding: 0 20px 100px; }

    .lyrics-invite-fixed {
      flex-shrink: 0;
      font-family: 'Lora', serif; font-size: 0.6rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 2px; color: var(--text-3);
      padding: 16px 20px; display: flex; align-items: center; gap: 10px;
    }
    .lyrics-invite-fixed::before, .lyrics-invite-fixed::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .lyrics-invite {
      font-family: 'Lora', serif; font-size: 0.6rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 2px; color: var(--text-3);
      margin-bottom: 16px; display: flex; align-items: center; gap: 10px;
    }
    .lyrics-invite::before, .lyrics-invite::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    .lyric-line {
      font-family: 'Lora', serif; font-size: 0.92rem; font-style: italic;
      color: var(--text-3); line-height: 1.75;
      padding: 7px 14px; border-radius: 8px; cursor: pointer;
      transition: color 0.15s, background 0.15s, opacity 0.3s;
      border: 1px solid transparent; text-align: center;
      position: relative;
    }
    .lyric-line:hover { color: var(--text-2); background: var(--surface-2); }

    /* Active: gold, glow */
    .lyric-line.active {
      color: var(--gold); background: var(--gold-faint);
      border-color: var(--gold-border); font-weight: 600;
    }
    .lyric-line.active::after {
      content: '';
      position: absolute; bottom: 3px; left: 50%;
      transform: translateX(-50%);
      width: 28px; height: 2px;
      background: var(--gold); border-radius: 2px;
    }

    /* Past: readable but clearly behind */
    .lyric-line.past { opacity: 0.28; }

    /* ── Coming soon state ── */
    .coming-state {
      text-align: center; padding: 60px 24px;
    }
    .coming-eyebrow {
      font-family: 'Lora', serif; font-size: 0.6rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 2px; color: var(--gold);
      margin-bottom: 12px; display: block;
    }
    .coming-title {
      font-family: 'Lora', serif; font-size: 1.15rem; font-weight: 700;
      color: var(--text); margin-bottom: 10px;
    }
    .coming-body {
      font-family: 'Lora', serif; font-size: 0.82rem;
      color: var(--text-3); line-height: 1.7; margin-bottom: 20px;
    }
    .coming-pill {
      display: inline-block;
      font-family: 'Lora', serif; font-size: 0.6rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px;
      color: var(--gold); border: 1px solid var(--gold-border);
      border-radius: 50px; padding: 6px 18px;
    }

    /* YouTube hidden player */
    #ytPlayer {
      position: fixed; bottom: 0; left: 0;
      width: 1px; height: 1px;
      opacity: 0; pointer-events: none; z-index: -1;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>

<!-- ── NAV ── -->
<nav class="site-nav">
  <a href="/" class="nav-logo" aria-label="Margo home">
    <span class="margo-mark margo-mark--lg">
      <span class="logo-ring"></span>
      <span class="logo-ring"></span>
      <span class="logo-ring"></span>
      <span class="logo-circle">
        <svg viewBox="-4 -4 88 88" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="40" cy="40" r="36" fill="#E8C547"/>
          <path d="M17 57 L17 27 L29 45 L40 26 L51 45 L63 27 L63 57" fill="none" stroke="#0B0B0D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="35" y="60" width="10" height="3.5" rx="1.75" fill="#0B0B0D" opacity=".55"/>
        </svg>
      </span>
    </span>
    <span class="nav-logo-text">MARGO</span>
  </a>
  <a href="/" class="nav-link">← Back</a>
</nav>

<!-- ══════════════════════
     SONG LIST PAGE
══════════════════════ -->
<div class="list-page" id="listPage">

  <div class="list-hero">
    <span class="list-eyebrow">Original Music</span>
    <h1 class="list-title">When words fail,<br/>drop a lyric.</h1>
    <p class="list-sub">Songs by Margo. Press play, feel a line, share it to the feed.</p>
  </div>

  <!-- Skeletons while loading -->
  <div id="songListWrap">
    <div style="margin:24px 16px 0;height:160px;border-radius:20px;background:var(--surface);border:1px solid var(--border);animation:skpulse 1.6s ease-in-out infinite;"></div>
    <div class="sk-grid" style="margin-top:24px;">
      <div class="sk-item"><div class="sk-item-body"></div></div>
      <div class="sk-item" style="animation-delay:0.2s;"><div class="sk-item-body"></div></div>
    </div>
  </div>

</div>

<!-- ══════════════════════
     PLAYER OVERLAY
══════════════════════ -->
<div id="playerOverlay">

  <!-- Atmospheric blurred background -->
  <div class="player-bg" id="playerBg"></div>
  <!-- Emotion color glow -->
  <div class="player-emotion-glow" id="emotionGlow"></div>

  <!-- Nav — absolutely frozen at top -->
  <div class="player-nav">
    <button class="player-back-btn" id="playerBackBtn">← All Songs</button>
    <span class="player-now-playing" id="nowPlayingLabel"></span>
  </div>
  <!-- Spacer that pushes flex content below the frozen nav -->
  <div class="player-nav-spacer"></div>

  <!-- Controls strip -->
  <div class="player-strip">
    <div class="strip-top">
      <div class="strip-cover" id="stripCover">M</div>
      <div class="strip-meta">
        <div class="strip-title" id="stripTitle"></div>
        <div class="strip-artist" id="stripArtist"></div>
        <div class="strip-platforms" id="stripPlatforms"></div>
      </div>
    </div>

    <div class="strip-progress" id="stripProgress" style="display:none;">
      <input type="range" class="progress-track" id="progressBar"
        min="0" max="100" value="0" step="0.1"/>
      <div class="progress-times">
        <span id="timeElapsed">0:00</span>
        <span id="timeDuration">0:00</span>
      </div>
    </div>

    <div class="strip-play-row">
      <button class="big-play-btn" id="playBtn" aria-label="Play">▶</button>
      <div class="play-state-wrap">
        <span class="play-state-text" id="playStateText">Tap to play</span>
        <span class="play-state-hint" id="playStateHint"></span>
      </div>
    </div>
  </div>

  <!-- Scrollable body -->
  <div class="player-body" id="playerBody">

    <!-- Sticky hero zone -->
    <div class="hero-zone" id="heroZone">
      <span class="hero-counter" id="heroCounter"></span>
      <div class="hero-lyric in" id="heroLyric">&nbsp;</div>
      <button class="share-lyric-btn" id="shareLyricBtn">+ Share this lyric</button>
    </div>

    <!-- TAP ANY LINE TO JUMP — frozen, never scrolls -->
    <div class="lyrics-invite-fixed">TAP ANY LINE TO JUMP</div>
    <!-- Lyrics list -->
    <div class="lyrics-pad" id="lyricsPad"></div>

  </div>
</div>

<!-- YouTube anchor -->
<div id="ytPlayer"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* ============================================================
   MARGO — music.js
   ============================================================ */

let _songs         = [];
let _activeSong    = null;
let _ytPlayer      = null;
let _ytReady       = false;
let _syncInterval  = null;
let _lyricsJson    = [];
let _allowAutoScroll = false;
let _activeIdx     = -1;
let _isPlaying     = false;
let _duration      = 0;
let _shareLoaded   = false;
let _lastHeroText  = '';
let _heroAnimating = false;

/* ── Emotion → ambient color map ── */
const EMOTION_COLORS = {
  Nostalgia:  'rgba(232,197,71,0.07)',
  Love:       'rgba(255,107,157,0.07)',
  Heartbreak: 'rgba(255,80,80,0.07)',
  Hope:       'rgba(107,140,255,0.07)',
  Healing:    'rgba(74,222,128,0.06)',
  Joy:        'rgba(255,200,71,0.07)',
  Rage:       'rgba(255,100,64,0.08)',
  Loneliness: 'rgba(160,160,255,0.07)',
};

/* ═══════════════════════════════
   FIREBASE
═══════════════════════════════ */
async function initMusicFirebase() {
  try {
    const res = await fetch('/api/config');
    if (!res.ok) throw new Error('config');
    const cfg = await res.json();
    firebase.initializeApp(cfg);
    loadSongs();
  } catch(e) {
    _showEmptyState('Could not connect. Please refresh.');
  }
}

function _normaliseSong(s) {
  if (s.status === 'active') s.status = 'live';
  if (!s.lyricsJson && s.srt) s.lyricsJson = parseLyrics(s.srt);
  if (s.featured === undefined && s.order === 1) s.featured = true;
  return s;
}

function loadSongs() {
  firebase.database().ref('songs').once('value')
    .then(snap => {
      _songs = [];
      snap.forEach(c => {
        const s = _normaliseSong(c.val());
        s.id = c.key;
        _songs.push(s);
      });
      _songs.sort((a, b) => (a.order || 99) - (b.order || 99));
      renderSongList();
    })
    .catch(() => _showEmptyState('Could not load songs.'));
}

/* ═══════════════════════════════
   SONG LIST
═══════════════════════════════ */
function renderSongList() {
  const wrap = document.getElementById('songListWrap');
  if (!wrap) return;
  wrap.innerHTML = '';

  if (!_songs.length) { _showEmptyState('Music coming soon.'); return; }

  const featured = _songs.find(s => s.featured && s.status === 'live')
                || _songs.find(s => s.status === 'live');
  const rest     = _songs.filter(s => s !== featured);
  const live     = rest.filter(s => s.status === 'live');
  const coming   = rest.filter(s => s.status === 'coming');
  const planned  = rest.filter(s => s.status === 'planned');

  // Featured big card
  if (featured) wrap.appendChild(_buildFeaturedCard(featured));

  // Live songs grid
  if (live.length) {
    const lbl = _sectionLabel('More Songs');
    wrap.appendChild(lbl);
    wrap.appendChild(_buildGrid(live));
  }

  // Coming soon grid
  if (coming.length) {
    wrap.appendChild(_sectionLabel('Coming Soon'));
    wrap.appendChild(_buildGrid(coming, true));
  }

  // In the works
  if (planned.length) {
    wrap.appendChild(_sectionLabel('In the Works'));
    wrap.appendChild(_buildGrid(planned, true));
  }
}

function _sectionLabel(text) {
  const el = document.createElement('span');
  el.className = 'section-label';
  el.textContent = text;
  return el;
}

function _buildGrid(songs, locked) {
  const grid = document.createElement('div');
  grid.className = 'song-grid';
  songs.forEach(s => grid.appendChild(_buildGridCard(s, locked)));
  return grid;
}

function _buildFeaturedCard(song) {
  const card = document.createElement('div');
  card.className = 'featured-card';
  card.style.marginTop = '24px';

  const coverHtml = song.artwork
    ? `<img src="${song.artwork}" alt="${_esc(song.title)}" onerror="this.parentNode.innerHTML='<div class=featured-cover-fallback><span>M</span></div>'"/>`
    : `<div class="featured-cover-fallback"><span>M</span></div>`;

  card.innerHTML = `
    <div class="featured-cover-wrap">
      ${coverHtml}
      <span class="featured-badge">Featured · Now Playing</span>
    </div>
    <div class="featured-body">
      <div class="featured-title">${_esc(song.title || 'Untitled')}</div>
      <div class="featured-meta">${_esc(song.artist || 'Margo')}${song.releaseDate ? ' · ' + _esc(song.releaseDate) : ''}</div>
      <button class="featured-cta">▶ &nbsp;Play &amp; Read Lyrics</button>
    </div>
  `;
  card.onclick = () => openPlayer(song);
  return card;
}

function _buildGridCard(song, locked) {
  const card = document.createElement('div');
  card.className = 'song-grid-card' + (locked ? ' coming' : '');

  const isLive = song.status === 'live';
  const tagClass = isLive ? 'tag-live' : (song.status === 'coming' ? 'tag-coming' : 'tag-planned');
  const tagText  = isLive ? 'Live' : (song.status === 'coming' ? 'Soon' : 'Coming');

  const coverContent = song.artwork
    ? `<img src="${_esc(song.artwork)}" alt="${_esc(song.title)}" onerror="this.style.display='none'"/>`
    : `<span class="grid-cover-letter">M</span>`;

  const lockIcon = locked ? `<div class="grid-lock">🔒</div>` : '';

  card.innerHTML = `
    <div class="grid-cover">
      ${coverContent}
      ${lockIcon}
    </div>
    <div class="grid-info">
      <div class="grid-title">${_esc(song.title || 'Untitled')}</div>
      <div class="grid-artist">${_esc(song.artist || 'Margo')}</div>
      <span class="grid-tag ${tagClass}">${tagText}</span>
    </div>
  `;

  if (isLive) card.onclick = () => openPlayer(song);
  return card;
}

function _showEmptyState(msg) {
  const wrap = document.getElementById('songListWrap');
  if (wrap) wrap.innerHTML = `<div style="text-align:center;padding:80px 24px;font-family:'Lora',serif;font-size:0.9rem;color:var(--text-3);font-style:italic;">${msg}</div>`;
}

function _esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ═══════════════════════════════
   PLAYER
═══════════════════════════════ */
function openPlayer(song) {
  _activeSong    = song;
  _lyricsJson    = Array.isArray(song.lyricsJson) ? song.lyricsJson : [];
  _activeIdx     = -1;
  _isPlaying     = false;
  _lastHeroText  = '';
  _heroAnimating = false;

  _ensureShareSheet();

  // Atmospheric background
  const bg = document.getElementById('playerBg');
  if (bg && song.artwork) { bg.style.backgroundImage = `url(${song.artwork})`; bg.style.opacity = '0.12'; }
  else if (bg) { bg.style.backgroundImage = ''; bg.style.opacity = '0'; }

  // Reset emotion glow
  _setEmotionGlow(null);

  // Now playing label (top right) — Margo voice, not just song name
  const nowLbl = document.getElementById('nowPlayingLabel');
  if (nowLbl) nowLbl.textContent = 'Now playing';

  // Strip
  const cover = document.getElementById('stripCover');
  if (cover) cover.innerHTML = song.artwork
    ? `<img src="${song.artwork}" alt="${_esc(song.title)}" onerror="this.parentNode.textContent='M'"/>`
    : 'M';

  const titleEl  = document.getElementById('stripTitle');
  const artistEl = document.getElementById('stripArtist');
  if (titleEl)  titleEl.textContent  = song.title  || '';
  if (artistEl) artistEl.textContent = (song.artist || 'Margo') + (song.releaseDate ? ' · ' + song.releaseDate : '');

  _renderPlatforms(song);

  const prog = document.getElementById('stripProgress');
  if (prog) prog.style.display = song.youtubeId ? 'block' : 'none';

  _setPlayBtn(false);
  const st = document.getElementById('playStateText');
  const sh = document.getElementById('playStateHint');
  if (st) st.textContent = 'Tap to play';
  if (sh) sh.textContent = song.youtubeId ? 'Audio via YouTube' : '';

  // Build body
  _allowAutoScroll = false;
  _buildPlayerBody(song);

  // Show
  const overlay = document.getElementById('playerOverlay');
  if (overlay) overlay.classList.add('open');
  document.body.classList.add('player-open');

  const body = document.getElementById('lyricsPad');
  if (body) requestAnimationFrame(() => { requestAnimationFrame(() => { body.scrollTop = 0; }); });
  setTimeout(() => { _allowAutoScroll = true; }, 2000);

  // Wire
  document.getElementById('playerBackBtn').onclick = closePlayer;
  document.getElementById('playBtn').onclick       = togglePlay;
  document.getElementById('shareLyricBtn').onclick = _shareActive;

  const bar = document.getElementById('progressBar');
  if (bar) bar.oninput = e => {
    if (_ytPlayer && _ytReady && _duration)
      _ytPlayer.seekTo((e.target.value / 100) * _duration, true);
  };

  if (song.youtubeId) _initYT(song.youtubeId);
}

function closePlayer() {
  document.getElementById('playerOverlay').classList.remove('open');
  document.body.classList.remove('player-open');
  _stopSync();
  if (_ytPlayer && _ytReady) { try { _ytPlayer.stopVideo(); } catch(e) {} }
  _isPlaying = false;
  _setPlayBtn(false);
  // Reset "now playing" label
  const nowLbl = document.getElementById('nowPlayingLabel');
  if (nowLbl) nowLbl.textContent = '';
}

function _renderPlatforms(song) {
  const wrap = document.getElementById('stripPlatforms');
  if (!wrap) return;
  wrap.innerHTML = '';
  const p = song.platforms || {};
  const defs = [
    { key:'youtube',    label:'YouTube'    },
    { key:'audiomack',  label:'Audiomack'  },
    { key:'boomplay',   label:'Boomplay'   },
    { key:'soundcloud', label:'SoundCloud' },
    { key:'spotify',    label:'Spotify'    },
    { key:'apple',      label:'Apple Music'},
  ];
  defs.forEach(({ key, label }) => {
    const url = p[key];
    if (!url) return;
    const a = document.createElement('a');
    a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.className = 'plat-btn'; a.textContent = label;
    wrap.appendChild(a);
  });
}

function _buildPlayerBody(song) {
  const heroZone = document.getElementById('heroZone');
  const pad      = document.getElementById('lyricsPad');
  if (!heroZone || !pad) return;
  pad.innerHTML = '';
  const spacer = document.createElement('div');
  spacer.className = 'hero-spacer';
  pad.appendChild(spacer);

  if (song.status === 'coming' || song.status === 'planned') {
    heroZone.style.visibility = 'hidden'; heroZone.style.pointerEvents = 'none';
    pad.innerHTML = `
      <div class="coming-state">
        <span class="coming-eyebrow">On its way</span>
        <div class="coming-title">${_esc(song.title)}</div>
        <div class="coming-body">This song is still being prepared.<br/>When it drops, every lyric will be here — ready to share to the feed.</div>
        ${song.releaseDate ? `<span class="coming-pill">Dropping ${_esc(song.releaseDate)}</span>` : ''}
      </div>`;
    return;
  }

  if (!_lyricsJson.length) {
    heroZone.style.visibility = 'hidden'; heroZone.style.pointerEvents = 'none';
    pad.innerHTML = `<div style="padding:48px 0;text-align:center;font-family:'Lora',serif;font-size:0.82rem;color:var(--text-3);font-style:italic;">Lyrics coming soon — check back after the drop.</div>`;
    return;
  }

  heroZone.style.visibility = 'visible'; heroZone.style.pointerEvents = '';

  // Reset hero
  const heroEl  = document.getElementById('heroLyric');
  const ctrEl   = document.getElementById('heroCounter');
  const shareEl = document.getElementById('shareLyricBtn');
  if (heroEl)  { heroEl.textContent = '\u00a0'; heroEl.className = 'hero-lyric in'; }
  if (ctrEl)   { ctrEl.textContent = ''; ctrEl.classList.remove('visible'); }
  if (shareEl) shareEl.classList.remove('visible');

  const list = document.createElement('div');
  list.id = 'lyricsList';

  _lyricsJson.forEach((line, i) => {
    const el = document.createElement('div');
    el.className = 'lyric-line';
    el.dataset.idx = i;
    el.textContent = line.text;
    el.onclick = () => {
      if (_ytPlayer && _ytReady) {
        _ytPlayer.seekTo(line.start, true);
        if (!_isPlaying) _ytPlayer.playVideo();
      }
    };
    list.appendChild(el);
  });

  pad.appendChild(list);
}

/* ─────────────────────────────
   Emotion glow
───────────────────────────── */
function _setEmotionGlow(emotion) {
  const glow = document.getElementById('emotionGlow');
  if (!glow) return;
  const color = emotion ? (EMOTION_COLORS[emotion] || EMOTION_COLORS.Nostalgia) : 'transparent';
  glow.style.background = `radial-gradient(ellipse at 50% 0%, ${color} 0%, transparent 70%)`;
}

/* ─────────────────────────────
   Share
───────────────────────────── */
function _shareActive() {
  if (_activeIdx < 0 || !_lyricsJson[_activeIdx]) return;
  const line = _lyricsJson[_activeIdx];
  const song = _activeSong;
  const fakePost = {
    text:      line.text,
    knowledge: { song: song?.title || '', artist: song?.artist || 'Margo' },
    emotion:   'Nostalgia',
    feeling:   'Nostalgia',
    timestamp: Date.now(),
  };

  if (typeof window.openShareSheet === 'function') {
    window.openShareSheet(fakePost, { context: `From: ${song?.title || 'Margo'}` });
    return;
  }
  _ensureShareSheet();
  let tries = 0;
  const poll = setInterval(() => {
    tries++;
    if (typeof window.openShareSheet === 'function') {
      clearInterval(poll);
      window.openShareSheet(fakePost, { context: `From: ${song?.title || 'Margo'}` });
    } else if (tries > 60) {
      clearInterval(poll);
      window.location.href = `/?sharelyric=${encodeURIComponent(line.text)}&song=${encodeURIComponent(song?.title||'')}&artist=${encodeURIComponent(song?.artist||'Margo')}`;
    }
  }, 100);
}

/* ─────────────────────────────
   Load export chain
───────────────────────────── */
function _ensureShareSheet() {
  if (_shareLoaded) return;
  _shareLoaded = true;

  const css = document.createElement('link');
  css.rel = 'stylesheet'; css.href = '/assets/gif-studio.css';
  document.head.appendChild(css);

  if (typeof window.showToast !== 'function') {
    window.showToast = function(msg) {
      const t = document.createElement('div');
      t.textContent = msg;
      t.style.cssText = 'position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#F4F1ED;font-family:Lora,serif;font-size:0.75rem;padding:10px 20px;border-radius:50px;border:1px solid rgba(255,255,255,0.1);z-index:9999;pointer-events:none;';
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2800);
    };
  }

  const chain = [
    '/js/media/gif/renderer.js',
    '/js/media/gif/exporter.js',
    '/js/core/brand.js',
    '/js/media/gif/gif-studio.js',
    '/js/media/poster/renderer.js',
    '/js/media/poster/exporter.js',
    '/js/media/poster/studio.js',
    '/js/media/share-sheet.js',
    '/js/features/duet-mode.js',
  ];
  function _next(i) {
    if (i >= chain.length) return;
    const s = document.createElement('script');
    s.src = chain[i];
    s.onload  = () => _next(i + 1);
    s.onerror = () => _next(i + 1);
    document.body.appendChild(s);
  }
  _next(0);
}

/* ═══════════════════════════════
   YOUTUBE
═══════════════════════════════ */
function _initYT(videoId) {
  _ytReady = false; _stopSync();
  if (window.YT && window.YT.Player) { _createYTPlayer(videoId); return; }
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
  window.onYouTubeIframeAPIReady = () => _createYTPlayer(videoId);
}

function _createYTPlayer(videoId) {
  if (_ytPlayer) { try { _ytPlayer.destroy(); } catch(e) {} _ytPlayer = null; }
  const c = document.getElementById('ytPlayer');
  if (c) c.innerHTML = '<div id="ytInner"></div>';
  _ytPlayer = new YT.Player('ytInner', {
    videoId,
    width: '1', height: '1',
    playerVars: { autoplay:0, controls:0, disablekb:1, fs:0, modestbranding:1, rel:0, playsinline:1, origin:window.location.origin },
    events: {
      onReady:       () => { _ytReady = true; _duration = _ytPlayer.getDuration() || 0; _updateDuration(); },
      onStateChange: _onYTState,
    }
  });
}

function _onYTState(e) {
  const S = YT.PlayerState;
  const st = document.getElementById('playStateText');
  if (e.data === S.PLAYING) {
    _isPlaying = true; _setPlayBtn(true);
    _duration = _ytPlayer.getDuration() || 0; _updateDuration();
    _startSync();
    if (st) st.textContent = 'Now playing';
  } else if (e.data === S.PAUSED) {
    _isPlaying = false; _setPlayBtn(false); _stopSync();
    if (st) st.textContent = 'Paused — tap to resume';
  } else if (e.data === S.ENDED) {
    _isPlaying = false; _setPlayBtn(false); _stopSync();
    if (st) st.textContent = 'Play it again ↑';
    // Clear hero on end
    _setEmotionGlow(null);
  }
}

function togglePlay() {
  if (!_ytPlayer || !_ytReady) {
    const url = _activeSong?.platforms?.youtube
      || (_activeSong?.youtubeId ? `https://www.youtube.com/watch?v=${_activeSong.youtubeId}` : null);
    if (url) window.open(url, '_blank');
    return;
  }
  if (_isPlaying) _ytPlayer.pauseVideo();
  else            _ytPlayer.playVideo();
}

function _setPlayBtn(playing) {
  const btn = document.getElementById('playBtn');
  if (btn) btn.textContent = playing ? '⏸' : '▶';
}

/* ═══════════════════════════════
   SYNC LOOP
═══════════════════════════════ */
function _startSync() {
  _stopSync();
  _syncInterval = setInterval(_syncLyrics, 100);
}
function _stopSync() {
  if (_syncInterval) { clearInterval(_syncInterval); _syncInterval = null; }
}

function _syncLyrics() {
  if (!_ytPlayer || !_ytReady || !_lyricsJson.length) return;
  let t;
  try { t = _ytPlayer.getCurrentTime() || 0; } catch(e) { return; }

  const bar = document.getElementById('progressBar');
  if (bar && _duration) bar.value = (t / _duration) * 100;
  const elapsed = document.getElementById('timeElapsed');
  if (elapsed) elapsed.textContent = _fmt(t);

  let newIdx = -1;
  for (let i = 0; i < _lyricsJson.length; i++) {
    if (t >= _lyricsJson[i].start && t < _lyricsJson[i].end) { newIdx = i; break; }
  }
  if (newIdx === _activeIdx) return;
  _activeIdx = newIdx;
  _updateUI(newIdx);
}

function _updateUI(idx) {
  const heroEl  = document.getElementById('heroLyric');
  const ctrEl   = document.getElementById('heroCounter');
  const shareEl = document.getElementById('shareLyricBtn');

  // ── Hero lyric — float-up transition ──
  if (heroEl) {
    if (idx >= 0 && _lyricsJson[idx]) {
      const newText = _lyricsJson[idx].text;
      if (newText !== _lastHeroText && !_heroAnimating) {
        _heroAnimating = true;
        _lastHeroText  = newText;

        // Step 1: slide out upward
        heroEl.classList.remove('in', 'gap');
        heroEl.classList.add('out');

        setTimeout(() => {
          // Step 2: swap text, drop in from below
          heroEl.textContent = newText;
          heroEl.classList.remove('out');
          heroEl.style.transform = 'translateY(12px)';
          heroEl.style.opacity   = '0';

          requestAnimationFrame(() => requestAnimationFrame(() => {
            heroEl.style.transform = '';
            heroEl.style.opacity   = '';
            heroEl.classList.add('in');
            _heroAnimating = false;
          }));
        }, 220);

        // Counter
        if (ctrEl) {
          ctrEl.textContent = `${idx + 1} of ${_lyricsJson.length}`;
          ctrEl.classList.add('visible');
        }

        // Emotion glow — cycles through Nostalgia for now, future: per-line tag
        _setEmotionGlow('Nostalgia');
      }
    } else if (idx === -1) {
      // Gap — dim but keep text
      heroEl.classList.remove('out', 'in');
      heroEl.classList.add('gap');
      if (ctrEl) ctrEl.classList.remove('visible');
    }
  }

  // Share button
  if (shareEl) shareEl.classList.toggle('visible', idx >= 0);

  // Lyrics list
  document.querySelectorAll('.lyric-line').forEach(el => {
    const i = parseInt(el.dataset.idx, 10);
    el.classList.toggle('active', i === idx);
    el.classList.toggle('past',   i <  idx);
  });

  // Auto-scroll active line into view (centered in list area)
  if (idx > 0 && _allowAutoScroll) {
    const active = document.querySelector('.lyric-line.active');
    const body = document.getElementById('lyricsPad');
    if (active && body) {
      const lineTop = active.offsetTop;
      const lineHeight = active.offsetHeight;
      const bodyHeight = body.offsetHeight;
      body.scrollTo({ top: lineTop - (bodyHeight / 2) + (lineHeight / 2), behavior: 'smooth' });
    }
  }
}

function _updateDuration() {
  const el = document.getElementById('timeDuration');
  if (el && _duration) el.textContent = _fmt(_duration);
}

function _fmt(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

/* ═══════════════════════════════
   LYRIC PARSERS
═══════════════════════════════ */
function parseLyrics(raw) {
  if (!raw?.trim()) return [];
  const t = raw.trim();
  if (/\d{2}:\d{2}:\d{2},\d{3}\s*-->\s*\d{2}:\d{2}:\d{2},\d{3}/.test(t)) return _parseSRT(t);
  if (/\[\d{2}:\d{2}[.:]\d{2,3}\]/.test(t)) return _parseLRC(t);
  return [];
}
function _srtSec(ts) {
  const [hms, ms] = ts.trim().split(',');
  const [h, m, s] = hms.split(':').map(Number);
  return h * 3600 + m * 60 + s + (parseInt(ms || '0') / 1000);
}
function _parseSRT(text) {
  const out = [];
  for (const block of text.split(/\n\s*\n/)) {
    const rows  = block.trim().split('\n');
    const tsRow = rows.find(r => r.includes('-->'));
    if (!tsRow) continue;
    const [ss, es] = tsRow.split('-->');
    const start = _srtSec(ss); const end = _srtSec(es);
    const ti    = rows.indexOf(tsRow);
    const lyric = rows.slice(ti + 1).filter(r => r.trim()).join(' ').trim();
    if (lyric && !isNaN(start)) out.push({ start, end, text: lyric });
  }
  return out;
}
function _parseLRC(text) {
  const parsed = [];
  for (const row of text.split('\n')) {
    const m = row.match(/^(\[\d{2}:\d{2}[.:]\d{2,3}\])\s*(.*)$/);
    if (!m) continue;
    const clean = m[1].replace(/[\[\]]/g, '');
    const [min, sec] = clean.split(':');
    const start = parseInt(min) * 60 + parseFloat(sec);
    const t = m[2].trim();
    if (t && !t.startsWith('[')) parsed.push({ start, text: t });
  }
  return parsed.map((p, i) => ({
    start: p.start,
    end:   parsed[i + 1] ? parsed[i + 1].start : p.start + 5,
    text:  p.text,
  }));
}

/* ── Boot ── */
initMusicFirebase();
