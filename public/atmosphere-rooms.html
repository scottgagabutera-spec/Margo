<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Atmosphere rooms — throwaway prototype</title>
  <style>
    :root {
      --bg: #07060A;
      --surface: #0F0E13;
      --text: #F4F1ED;
      --text-muted: #8A8894;
      --gold: #E8C547;
      --gold-warm: #F5D46A;
      --gold-deep: #8A7018;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }
    .wrap {
      max-width: 880px;
      margin: 0 auto;
      padding: 20px 16px 48px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 640px) {
      .wrap { padding: 28px 24px 64px; }
      .grid { grid-template-columns: 1fr 1fr; gap: 18px; }
    }

    /* Card chrome — never translated, never scaled */
    .card {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      min-height: 240px;
      padding: 22px 20px 28px;
      border-radius: 18px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.07);
    }
    .lyric {
      position: relative;
      z-index: 2;
      margin: 36px 4px 10px;
      font-style: italic;
      font-size: 1.28rem;
      line-height: 1.45;
    }
    .name {
      position: relative;
      z-index: 2;
      font-family: system-ui, sans-serif;
      font-size: 0.62rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* ── Breath: the card surface is the lung ── */
    .breath-wash {
      position: absolute;
      inset: 0;
      background: var(--gold);
      opacity: 0.045;
      pointer-events: none;
      animation: breath-wash 7.4s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    @keyframes breath-wash {
      0%, 100% { opacity: 0.035; }
      50% { opacity: 0.155; }
    }
    /* Full-card fabric — scales as one surface. Lyric is not on this layer. */
    .breath-stretch {
      position: absolute;
      inset: -12%;
      pointer-events: none;
      transform-origin: 50% 50%;
      background:
        repeating-linear-gradient(
          180deg,
          transparent 0,
          transparent 17px,
          rgba(232,197,71,0.07) 17px,
          rgba(232,197,71,0.07) 18px
        );
      opacity: 0.45;
      animation: breath-stretch 7.4s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    @keyframes breath-stretch {
      0%, 100% {
        opacity: 0.28;
        transform: scale(1, 1);
      }
      50% {
        opacity: 0.7;
        transform: scale(1.09, 1.045);
      }
    }

    /* ── Pulse: the card edge hits, lyric stays put ── */
    .pulse-wash {
      position: absolute;
      inset: 0;
      background: var(--gold);
      opacity: 0.03;
      pointer-events: none;
      animation: pulse-wash 2.9s cubic-bezier(0.33, 0.9, 0.4, 1) infinite;
    }
    .pulse-edge {
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      box-shadow:
        inset 0 0 0 1px rgba(232,197,71,0.18),
        inset 0 0 28px 4px rgba(232,197,71,0.22),
        inset 0 0 70px 10px rgba(232,197,71,0.1);
      opacity: 0.22;
      animation: pulse-edge 2.9s cubic-bezier(0.33, 0.9, 0.4, 1) infinite;
    }
    @keyframes pulse-wash {
      0%, 8% { opacity: 0.03; }
      14% { opacity: 0.16; }
      24% { opacity: 0.05; }
      30% { opacity: 0.12; }
      50%, 100% { opacity: 0.03; }
    }
    @keyframes pulse-edge {
      0%, 8% { opacity: 0.18; }
      14% { opacity: 0.95; }
      24% { opacity: 0.28; }
      30% { opacity: 0.7; }
      55%, 100% { opacity: 0.18; }
    }

    /* ── Drift: the card is the river ── */
    .drift-well {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .drift-band {
      position: absolute;
      top: -10%;
      height: 120%;
      width: 220%;
      left: -80%;
      background: linear-gradient(
        105deg,
        transparent 0%,
        transparent 28%,
        rgba(232,197,71,0.05) 36%,
        rgba(232,197,71,0.16) 48%,
        rgba(245,215,106,0.12) 54%,
        rgba(232,197,71,0.04) 64%,
        transparent 78%,
        transparent 100%
      );
      animation: drift-a 16s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    .drift-band-b {
      width: 240%;
      left: -100%;
      background: linear-gradient(
        98deg,
        transparent 0%,
        rgba(232,197,71,0.03) 30%,
        rgba(232,197,71,0.11) 46%,
        transparent 62%,
        transparent 100%
      );
      animation: drift-b 22s 1.4s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    .drift-band-c {
      width: 200%;
      left: -70%;
      opacity: 0.7;
      background: linear-gradient(
        112deg,
        transparent 40%,
        rgba(245,215,106,0.1) 52%,
        transparent 66%
      );
      animation: drift-c 19s 0.6s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    @keyframes drift-a {
      0% { transform: translateX(0); }
      100% { transform: translateX(42%); }
    }
    @keyframes drift-b {
      0% { transform: translateX(8%); }
      100% { transform: translateX(-28%); }
    }
    @keyframes drift-c {
      0% { transform: translateX(-6%); }
      100% { transform: translateX(36%); }
    }

    /* ── Weight: drops across the bottom half, collect as a floor ── */
    .weight-well {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      bottom: 0;
      overflow: hidden;
      pointer-events: none;
      container-type: size;
    }
    .weight-floor {
      position: absolute;
      left: -8%;
      right: -8%;
      bottom: -18%;
      height: 52%;
      background: radial-gradient(ellipse at 50% 100%,
        rgba(232,197,71,0.28) 0%,
        rgba(232,197,71,0.12) 42%,
        transparent 74%);
      animation: weight-floor 14s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    @keyframes weight-floor {
      0%, 100% { opacity: 0.85; transform: translateY(0) scaleY(1); }
      50% { opacity: 1; transform: translateY(4%) scaleY(1.08); }
    }
    .drop {
      position: absolute;
      width: 11px;
      height: 15px;
      top: -18px;
      animation: drop-fall linear infinite;
    }
    .drop svg { display: block; width: 100%; height: 100%; }
    @keyframes drop-fall {
      0% { transform: translateY(0) scale(0.85, 1); opacity: 0; }
      8% { opacity: 0.9; }
      82% { opacity: 0.85; transform: translateY(100cqh) scale(1, 1); }
      92% { opacity: 0.4; transform: translateY(108cqh) scale(1.25, 0.55); }
      100% { opacity: 0; transform: translateY(112cqh) scale(1.4, 0.35); }
    }
    .d1 { left: 8%; animation-duration: 5.8s; animation-delay: 0s; }
    .d2 { left: 18%; width: 8px; height: 11px; animation-duration: 7.2s; animation-delay: 1.1s; }
    .d3 { left: 27%; animation-duration: 6.4s; animation-delay: 2.4s; }
    .d4 { left: 36%; width: 9px; height: 13px; animation-duration: 8.1s; animation-delay: 0.6s; }
    .d5 { left: 46%; animation-duration: 5.5s; animation-delay: 3.2s; }
    .d6 { left: 55%; width: 8px; height: 11px; animation-duration: 6.9s; animation-delay: 1.8s; }
    .d7 { left: 64%; animation-duration: 7.6s; animation-delay: 4.1s; }
    .d8 { left: 73%; width: 10px; height: 14px; animation-duration: 5.2s; animation-delay: 2.8s; }
    .d9 { left: 82%; animation-duration: 8.4s; animation-delay: 0.3s; }
    .d10 { left: 90%; width: 8px; height: 11px; animation-duration: 6.1s; animation-delay: 3.7s; }
    .d11 { left: 13%; width: 7px; height: 10px; animation-duration: 9s; animation-delay: 5.2s; }
    .d12 { left: 69%; width: 7px; height: 10px; animation-duration: 7.8s; animation-delay: 4.8s; }

    @media (prefers-reduced-motion: reduce) {
      .breath-wash, .breath-stretch, .pulse-wash, .pulse-edge, .drift-band, .drift-band-b, .drift-band-c,
      .weight-floor, .drop { animation: none !important; }
      .breath-wash, .pulse-wash { opacity: 0.06; }
      .pulse-edge { opacity: 0.2; }
      .drop { opacity: 0; }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <defs>
      <radialGradient id="dropFill" cx="36%" cy="30%" r="72%">
        <stop offset="0%" stop-color="#F7E7A4" />
        <stop offset="42%" stop-color="#E8C547" />
        <stop offset="100%" stop-color="#6F5910" />
      </radialGradient>
    </defs>
  </svg>

  <div class="wrap">
    <div class="grid">

      <article class="card" data-room="weight">
        <div class="weight-well">
          <div class="weight-floor"></div>
          <span class="drop d1"><svg viewBox="0 0 14 18"><ellipse cx="7.6" cy="10.4" rx="3.3" ry="4.4" fill="rgba(0,0,0,0.4)"/><ellipse cx="7" cy="9" rx="3.1" ry="4.2" fill="url(#dropFill)"/><ellipse cx="5.7" cy="6.8" rx="1.15" ry="1.45" fill="rgba(255,255,255,0.5)"/></svg></span>
          <span class="drop d2"><svg viewBox="0 0 14 18"><ellipse cx="7.6" cy="10.4" rx="3.3" ry="4.4" fill="rgba(0,0,0,0.4)"/><ellipse cx="7" cy="9" rx="3.1" ry="4.2" fill="url(#dropFill)"/><ellipse cx="5.7" cy="6.8" rx="1.15" ry="1.45" fill="rgba(255,255,255,0.5)"/></svg></span>
          <span class="drop d3"><svg viewBox="0 0 14 18"><ellipse cx="7.6" cy="10.4" rx="3.3" ry="4.4" fill="rgba(0,0,0,0.4)"/><ellipse cx="7" cy="9" rx="3.1" ry="4.2" fill="url(#dropFill)"/><ellipse cx="5.7" cy="6.8" rx="1.15" ry="1.45" fill="rgba(255,255,255,0.5)"/></svg></span>
          <span class="drop d4"><svg viewBox="0 0 14 18"><ellipse cx="7.6" cy="10.4" rx="3.3" ry="4.4" fill="rgba(0,0,0,0.4)"/><ellipse cx="7" cy="9" rx="3.1" ry="4.2" fill="url(#dropFill)"/><ellipse cx="5.7" cy="6.8" rx="1.15" ry="1.45" fill="rgba(255,255,255,0.5)"/></svg></span>
          <span class="drop d5"><svg viewBox="0 0 14 18"><ellipse cx="7.6" cy="10.4" rx="3.3" ry="4.4" fill="rgba(0,0,0,0.4)"/><ellipse cx="7" cy="9" rx="3.1" ry="4.2" fill="url(#dropFill)"/><ellipse cx="5.7" cy="6.8" rx="1.15" ry="1.45" fill="rgba(255,255,255,0.5)"/></svg></span>
          <span class="drop d6"><svg viewBox="0 0 14 18"><ellipse cx="7.6" cy="10.4" rx="3.3" ry="4.4" fill="rgba(0,0,0,0.4)"/><ellipse cx="7" cy="9" rx="3.1" ry="4.2" fill="url(#dropFill)"/><ellipse cx="5.7" cy="6.8" rx="1.15" ry="1.45" fill="rgba(255,255,255,0.5)"/></svg></span>
          <span class="drop d7"><svg viewBox="0 0 14 18"><ellipse cx="7.6" cy="10.4" rx="3.3" ry="4.4" fill="rgba(0,0,0,0.4)"/><ellipse cx="7" cy="9" rx="3.1" ry="4.2" fill="url(#dropFill)"/><ellipse cx="5.7" cy="6.8" rx="1.15" ry="1.45" fill="rgba(255,255,255,0.5)"/></svg></span>
          <span class="drop d8"><svg viewBox="0 0 14 18"><ellipse cx="7.6" cy="10.4" rx="3.3" ry="4.4" fill="rgba(0,0,0,0.4)"/><ellipse cx="7" cy="9" rx="3.1" ry="4.2" fill="url(#dropFill)"/><ellipse cx="5.7" cy="6.8" rx="1.15" ry="1.45" fill="rgba(255,255,255,0.5)"/></svg></span>
          <span class="drop d9"><svg viewBox="0 0 14 18"><ellipse cx="7.6" cy="10.4" rx="3.3" ry="4.4" fill="rgba(0,0,0,0.4)"/><ellipse cx="7" cy="9" rx="3.1" ry="4.2" fill="url(#dropFill)"/><ellipse cx="5.7" cy="6.8" rx="1.15" ry="1.45" fill="rgba(255,255,255,0.5)"/></svg></span>
          <span class="drop d10"><svg viewBox="0 0 14 18"><ellipse cx="7.6" cy="10.4" rx="3.3" ry="4.4" fill="rgba(0,0,0,0.4)"/><ellipse cx="7" cy="9" rx="3.1" ry="4.2" fill="url(#dropFill)"/><ellipse cx="5.7" cy="6.8" rx="1.15" ry="1.45" fill="rgba(255,255,255,0.5)"/></svg></span>
          <span class="drop d11"><svg viewBox="0 0 14 18"><ellipse cx="7.6" cy="10.4" rx="3.3" ry="4.4" fill="rgba(0,0,0,0.4)"/><ellipse cx="7" cy="9" rx="3.1" ry="4.2" fill="url(#dropFill)"/><ellipse cx="5.7" cy="6.8" rx="1.15" ry="1.45" fill="rgba(255,255,255,0.5)"/></svg></span>
          <span class="drop d12"><svg viewBox="0 0 14 18"><ellipse cx="7.6" cy="10.4" rx="3.3" ry="4.4" fill="rgba(0,0,0,0.4)"/><ellipse cx="7" cy="9" rx="3.1" ry="4.2" fill="url(#dropFill)"/><ellipse cx="5.7" cy="6.8" rx="1.15" ry="1.45" fill="rgba(255,255,255,0.5)"/></svg></span>
        </div>
        <p class="lyric">the night sits on my chest</p>
        <span class="name">Weight</span>
      </article>

      <article class="card" data-room="breath">
        <div class="breath-wash"></div>
        <div class="breath-stretch"></div>
        <p class="lyric">breathe me back in</p>
        <span class="name">Breath</span>
      </article>

      <article class="card" data-room="drift">
        <div class="drift-well">
          <div class="drift-band"></div>
          <div class="drift-band drift-band-b"></div>
          <div class="drift-band drift-band-c"></div>
        </div>
        <p class="lyric">let the river take it</p>
        <span class="name">Drift</span>
      </article>

      <article class="card" data-room="pulse">
        <div class="pulse-wash"></div>
        <div class="pulse-edge"></div>
        <p class="lyric">hit me like a kick drum</p>
        <span class="name">Pulse</span>
      </article>

    </div>
  </div>
</body>
</html>
