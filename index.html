<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>MARGO — When words fail, drop a line</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- LANDING -->
<section id="landing" class="screen active">
  <div class="center">
    <h1 class="logo">MARGO</h1>
    <p class="tagline">When words fail, drop a line.</p>
    <button id="enterBtn" class="primary-btn">Drop a line</button>
  </div>
</section>

<!-- FEED -->
<section id="feed" class="screen">
  <header class="feed-header">
    <button id="backBtn" class="header-btn">←</button>
    <div class="header-center">
      <h2>Live Feed</h2>
      <p class="post-count"><span id="postCount">0</span> posts</p>
    </div>
    <button id="openComposer" class="header-btn">+ Drop</button>
  </header>
  <div id="feedList" class="feed-list"></div>
</section>

<!-- COMPOSER MODAL - FIXED ORDER -->
<div id="composer" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Drop a line</h3>
      <button id="closeComposer" class="close-btn">×</button>
    </div>
    <div class="modal-body">
      <!-- STEP 1: Lyric -->
      <label>Lyric *</label>
      <textarea id="textInput" maxlength="140" placeholder="The line stuck in your head..." required></textarea>
      <div class="char-count"><span id="charCount">0</span>/140</div>

      <!-- STEP 2: Emotion -->
      <label>Emotion *</label>
      <div class="emotion-pills">
        <button class="emotion-pill" data-emotion="Love" type="button">Love</button>
        <button class="emotion-pill" data-emotion="Heartbreak" type="button">Heartbreak</button>
        <button class="emotion-pill" data-emotion="Hope" type="button">Hope</button>
        <button class="emotion-pill" data-emotion="Nostalgia" type="button">Nostalgia</button>
        <button class="emotion-pill" data-emotion="Healing" type="button">Healing</button>
        <button class="emotion-pill" data-emotion="Joy" type="button">Joy</button>
        <button class="emotion-pill" data-emotion="Rage" type="button">Rage</button>
        <button class="emotion-pill" data-emotion="Loneliness" type="button">Loneliness</button>
      </div>

      <!-- STEP 3: Mode -->
      <label>What's your intention?</label>
      <div class="mode-options">
        <button class="mode-btn active" data-mode="share" type="button">
          <span class="mode-icon">♫</span>
          <span>Share</span>
        </button>
        <button class="mode-btn" data-mode="guess" type="button">
          <span class="mode-icon">?</span>
          <span>Guess</span>
        </button>
        <button class="mode-btn" data-mode="discover" type="button">
          <span class="mode-icon">✨</span>
          <span>Discover</span>
        </button>
      </div>

      <!-- STEP 4: Mode-specific inputs -->
      <div id="shareInputs" class="conditional active">
        <label>Song Details *</label>
        <input id="songInput" placeholder="Song title" required/>
        <input id="artistInput" placeholder="Artist" required/>
      </div>

      <div id="guessInputs" class="conditional">
        <label>Answer Key</label>
        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="guessSongCheck" checked>
            <span>Let them guess the song</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="guessArtistCheck" checked>
            <span>Let them guess the artist</span>
          </label>
        </div>
        <input id="guessSongAnswer" placeholder="Correct song title"/>
        <input id="guessArtistAnswer" placeholder="Correct artist"/>
      </div>

      <div id="discoverInputs" class="conditional">
        <p class="hint">Don't know the song? The community will help you discover it!</p>
        <input id="discoverSongInput" placeholder="Maybe song? (optional)"/>
        <input id="discoverArtistInput" placeholder="Maybe artist? (optional)"/>
      </div>

      <!-- STEP 5: Streaming Links (Optional) - ALWAYS LAST -->
      <details class="streaming-section">
        <summary>+ Add Streaming Links (Optional)</summary>
        <div class="streaming-links">
          <div class="input-group-small">
            <label>Spotify</label>
            <input id="spotifyLink" type="url" placeholder="https://open.spotify.com/track/..."/>
          </div>
          <div class="input-group-small">
            <label>Apple Music</label>
            <input id="appleLink" type="url" placeholder="https://music.apple.com/..."/>
          </div>
          <div class="input-group-small">
            <label>YouTube</label>
            <input id="youtubeLink" type="url" placeholder="https://youtube.com/watch?v=..."/>
          </div>
          <div class="input-group-small">
            <label>SoundCloud</label>
            <input id="soundcloudLink" type="url" placeholder="https://soundcloud.com/..."/>
          </div>
        </div>
      </details>
    </div>
    <div class="modal-footer">
      <button id="postBtn" class="primary-btn full">Post</button>
    </div>
  </div>
</div>

<!-- GUESS MODAL -->
<div id="guessModal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Guess the Song</h3>
      <button id="closeGuess" class="close-btn">×</button>
    </div>
    <div class="modal-body">
      <div class="lyric-display" id="guessLyric"></div>
      <p class="hint" id="guessHint"></p>
      <div id="guessInputFields">
        <input id="guessSongInput" placeholder="Song title" class="guess-field"/>
        <input id="guessArtistInput" placeholder="Artist" class="guess-field"/>
      </div>
      <div id="guessResult" class="result-message hidden"></div>
    </div>
    <div class="modal-footer">
      <button id="submitGuess" class="primary-btn full">Submit Guess</button>
      <button id="revealAnswer" class="secondary-btn full hidden">Reveal Answer</button>
    </div>
  </div>
</div>

<!-- DISCOVER MODAL -->
<div id="discoverModal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Help Discover</h3>
      <button id="closeDiscover" class="close-btn">×</button>
    </div>
    <div class="modal-body">
      <div class="lyric-display" id="discoverLyric"></div>
      <p class="hint">Know this song? Help them out!</p>
      <input id="discoverSongAnswer" placeholder="Song title"/>
      <input id="discoverArtistAnswer" placeholder="Artist"/>
    </div>
    <div class="modal-footer">
      <button id="submitDiscover" class="primary-btn full">Help Them Discover</button>
    </div>
  </div>
</div>

<!-- LISTEN MODAL -->
<div id="listenModal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Listen</h3>
      <button id="closeListen" class="close-btn">×</button>
    </div>
    <div class="modal-body">
      <p class="hint">Available streaming links:</p>
      <div class="listen-links" id="listenLinks"></div>
    </div>
  </div>
</div>

<!-- SHARE MODAL -->
<div id="shareModal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Share</h3>
      <button id="closeShare" class="close-btn">×</button>
    </div>
    <div class="modal-body">
      <div class="share-options">
        <button class="share-btn" data-action="copy">
          <span class="share-icon">🔗</span>
          <span>Copy Link</span>
        </button>
        <button class="share-btn" data-action="native">
          <span class="share-icon">↗</span>
          <span>Share</span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- POSTCARD MODAL -->
<div id="postcardModal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Post</h3>
      <button id="closePostcard" class="close-btn">×</button>
    </div>
    <div class="modal-body">
      <div class="postcard">
        <div class="postcard-header">MARGO</div>
        <div class="postcard-lyric" id="postcardLyric"></div>
        <div class="postcard-emotion" id="postcardEmotion"></div>
        <div class="postcard-song" id="postcardSong"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button id="listenPostcard" class="secondary-btn full">Listen</button>
      <button id="sharePostcard" class="primary-btn full">Share</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
