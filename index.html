<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>MARGO — Drop a Lyric</title>

<link rel="stylesheet" href="style.css" />

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

</head>
<body>

<div id="app">

<!-- LANDING -->
<section id="landing" class="screen active">

  <div class="landing-inner">

    <h1>MARGO</h1>

    <p class="tagline">When words fail, drop a lyric.</p>

    <p class="sub">Curse. Confess. Quote. Feel.</p>

    <button id="enterBtn" class="primary-btn">
      Enter
    </button>

  </div>

</section>


<!-- FEED -->
<section id="feed" class="screen">

  <header class="feed-header">

    <button id="backBtn">←</button>

    <h2>Live Feed</h2>

    <button id="openComposer">＋</button>

  </header>

  <div id="feedList" class="feed-grid"></div>

</section>


<!-- COMPOSER -->
<div id="composer" class="modal hidden">

  <div class="modal-card">

    <header>
      <h3>Drop Your Line</h3>
      <button id="closeComposer">✕</button>
    </header>

    <textarea
      id="textInput"
      maxlength="140"
      placeholder="Write what you feel..."
    ></textarea>

    <div class="counter">
      <span id="count">0</span>/140
    </div>

    <div class="row">

      <input
        id="songInput"
        placeholder="Inspired by song"
      />

      <input
        id="artistInput"
        placeholder="Artist"
      />

    </div>

    <label class="hide-row">

      <input type="checkbox" id="hideCheck" />

      Hide inspiration

    </label>

    <div id="emotionPills" class="pills">

      <button data-e="Love">Love</button>
      <button data-e="Heartbreak">Heartbreak</button>
      <button data-e="Hope">Hope</button>
      <button data-e="Healing">Healing</button>
      <button data-e="Rage">Rage</button>
      <button data-e="Joy">Joy</button>
      <button data-e="Loneliness">Loneliness</button>
      <button data-e="Freedom">Freedom</button>
      <button data-e="Anxiety">Anxiety</button>

    </div>

    <button id="postBtn" class="primary-btn">
      Post
    </button>

  </div>

</div>

</div>

<script src="script.js"></script>
</body>
</html>
