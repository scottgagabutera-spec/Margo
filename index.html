<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MARGO</title>

  <!-- Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LANDING -->
<div id="landing" class="screen active">
  <div class="center">
    <div class="logo">MARGO</div>
    <button id="enterBtn" class="primary-btn">Enter</button>
  </div>
</div>

<!-- FEED -->
<div id="feed" class="screen">
  <div class="feed-header">
    <button id="openComposer" class="primary-btn">Drop a line</button>
    <div class="post-count"><span id="postCount">0</span> posts</div>
  </div>
  <div id="feedList" class="feed-list"></div>
</div>

<!-- COMPOSER -->
<div id="composer" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Drop a line</h3>
      <button onclick="closeComposer()">×</button>
    </div>
    <div class="modal-body">
      <textarea id="textInput" placeholder="Write a lyric or thought..."></textarea>

      <div class="mode-options">
        <button class="mode-btn active" data-mode="share">Share</button>
        <button class="mode-btn" data-mode="guess">Guess</button>
        <button class="mode-btn" data-mode="discover">Discover</button>
      </div>

      <div id="shareFields" class="conditional active">
        <input id="songInput" placeholder="Song">
        <input id="artistInput" placeholder="Artist">
      </div>

      <div id="guessFields" class="conditional">
        <input id="guessSongAnswer" placeholder="Correct song">
        <input id="guessArtistAnswer" placeholder="Correct artist">
      </div>

      <div class="emotion-pills">
        <button class="emotion-pill">Love</button>
        <button class="emotion-pill">Hope</button>
        <button class="emotion-pill">Heartbreak</button>
        <button class="emotion-pill">Joy</button>
        <button class="emotion-pill">Loneliness</button>
      </div>
    </div>
    <div class="modal-footer">
      <button id="postBtn" class="primary-btn">Post</button>
    </div>
  </div>
</div>

<!-- POSTCARD -->
<div id="postcardModal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Postcard</h3>
      <button onclick="closePostcard()">×</button>
    </div>
    <div id="postcardBody" class="modal-body"></div>
  </div>
</div>

<!-- GUESS -->
<div id="guessModal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Guess</h3>
      <button onclick="closeGuess()">×</button>
    </div>
    <div class="modal-body">
      <input id="userGuessSong" placeholder="Song">
      <input id="userGuessArtist" placeholder="Artist">
      <button onclick="submitGuess()" class="primary-btn">Submit</button>
      <div id="guessResult"></div>
    </div>
  </div>
</div>

<!-- DISCOVER -->
<div id="discoverModal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Help discover</h3>
      <button onclick="closeDiscover()">×</button>
    </div>
    <div class="modal-body">
      <input id="discoverSong" placeholder="Song">
      <input id="discoverArtist" placeholder="Artist">
      <button onclick="submitDiscover()" class="primary-btn">Submit</button>
    </div>
  </div>
</div>

<!-- SHARE -->
<div id="shareModal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Share</h3>
      <button onclick="closeShare()">×</button>
    </div>
    <div class="modal-body">
      <button onclick="copyShareLink()" class="primary-btn">Copy link</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="script.js"></script>
</body>
</html>
