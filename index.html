<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MARGO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LANDING -->
<section id="landing" class="screen active">
  <h1>MARGO</h1>
  <p>When words fail, drop a line</p>
  <button id="enterBtn">Drop a line</button>
</section>

<!-- FEED -->
<section id="feed" class="screen">
  <header>
    <button id="backBtn">←</button>
    <h2>Feed</h2>
    <button id="openComposer">+ Drop</button>
  </header>
  <div id="feedList"></div>
</section>

<!-- COMPOSER -->
<div id="composer" class="modal hidden">
  <h3>Drop a line</h3>
  <textarea id="textInput" placeholder="Lyric..."></textarea>

  <p>Emotion:</p>
  <div id="emotions">
    <button data-emotion="Love">Love</button>
    <button data-emotion="Sad">Sad</button>
    <button data-emotion="Joy">Joy</button>
  </div>

  <p>Mode:</p>
  <button class="modeBtn" data-mode="share">Share</button>
  <button class="modeBtn" data-mode="guess">Guess</button>
  <button class="modeBtn" data-mode="discover">Discover</button>

  <div id="shareInputs">
    <input id="songInput" placeholder="Song">
    <input id="artistInput" placeholder="Artist">
  </div>

  <div id="guessInputs" class="hidden">
    <input id="guessSongAnswer" placeholder="Correct Song">
    <input id="guessArtistAnswer" placeholder="Correct Artist">
  </div>

  <div id="discoverInputs" class="hidden">
    <p>Community will help discover</p>
  </div>

  <p>Streaming links (optional)</p>
  <input id="spotifyLink" placeholder="Spotify link">

  <br><br>
  <button id="postBtn">Post</button>
  <button id="closeComposer">Close</button>
</div>

<!-- GUESS MODAL -->
<div id="guessModal" class="modal hidden">
  <p id="guessLyric"></p>
  <input id="guessSongInput" placeholder="Song guess">
  <input id="guessArtistInput" placeholder="Artist guess">
  <button id="submitGuess">Submit</button>
  <p id="guessResult"></p>
</div>

<!-- LISTEN MODAL -->
<div id="listenModal" class="modal hidden">
  <a id="listenLink" target="_blank">Open link</a>
  <button id="closeListen">Close</button>
</div>

<script src="script.js"></script>
</body>
</html>
