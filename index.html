<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MARGO — When words fail, drop a lyric</title>

<link rel="stylesheet" href="style.css"/>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<div id="app">

<!-- LANDING -->
<section id="landing" class="screen active">

<div class="landing-center">

<h1 class="logo">MARGO</h1>

<p class="tagline">When words fail, drop a lyric.</p>

<p class="subtagline">Curse. Confess. Quote. Feel.</p>

<button id="openComposer" class="cta-btn">
Drop Your Line
</button>

<p class="hint">Swipe to explore →</p>

</div>

<footer>
No login. No ads. Just raw feelings.
</footer>

</section>


<!-- FEED -->
<section id="feed" class="screen">

<header class="feed-header">

<button id="feedBackBtn">←</button>

<h2>Live Feed</h2>

</header>

<div id="feedList" class="feed-grid"></div>

</section>


</div>


<!-- COMPOSER MODAL -->
<div id="composer" class="modal hidden">

<div class="modal-box">

<header>

<h3>Drop Your Line</h3>

<button id="closeComposer">✕</button>

</header>

<textarea id="textInput" maxlength="140"
placeholder="Drop your line..."></textarea>

<div class="counter">
<span id="count">0</span>/140
</div>

<div class="row">

<input id="songInput" placeholder="Song" />

<input id="artistInput" placeholder="Artist" />

</div>

<div id="emotionPills" class="emotions">

<button data-emotion="Love">Love</button>
<button data-emotion="Heartbreak">Heartbreak</button>
<button data-emotion="Hope">Hope</button>
<button data-emotion="Nostalgia">Nostalgia</button>
<button data-emotion="Healing">Healing</button>
<button data-emotion="Rage">Rage</button>
<button data-emotion="Joy">Joy</button>
<button data-emotion="Loneliness">Loneliness</button>
<button data-emotion="Freedom">Freedom</button>
<button data-emotion="Anxiety">Anxiety</button>

</div>

<button id="postBtn" class="primary">
Post
</button>

</div>

</div>



<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script src="script.js"></script>

</body>
</html>
