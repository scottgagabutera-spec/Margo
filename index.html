<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MARGO</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>

<body class="dark">

<!-- Theme Toggle -->
<button id="themeToggle" class="theme-toggle">🌓</button>

<!-- LANDING -->
<section id="landing" class="screen active">

  <div class="landing-inner">

    <h1 class="logo">MARGO</h1>

    <p class="tagline">
      When words fail, drop a lyric.<br>
      Curse. Confess. Quote. Feel.
    </p>

    <button id="openFeed" class="primary-btn">
      Enter
    </button>

  </div>

</section>


<!-- FEED -->
<section id="feed" class="screen">

<header class="feed-header">

  <button id="backHome">←</button>

  <h2>Live Feed</h2>

  <button id="openComposer" class="plus-btn">＋</button>

</header>


<div id="feedList" class="feed-grid"></div>

</section>


<!-- COMPOSER MODAL -->
<div id="composer" class="hidden">

  <div class="composer-card">

    <header>
      <h3>Drop Your Line</h3>
      <button id="closeComposer">✕</button>
    </header>


    <textarea
      id="textInput"
      maxlength="140"
      placeholder="Write what you feel..."
    ></textarea>

    <div class="counter">
      <span id="count">0</span>/140
    </div>


    <div class="row">
      <input id="songInput" placeholder="Inspired by song">
      <input id="artistInput" placeholder="Artist">
    </div>


    <label class="hide-row">
      <input type="checkbox" id="hideToggle">
      Hide inspiration
    </label>


    <div class="emotions">

      <button class="emotion-pill" data-emotion="Love">Love</button>
      <button class="emotion-pill" data-emotion="Heartbreak">Heartbreak</button>
      <button class="emotion-pill" data-emotion="Hope">Hope</button>
      <button class="emotion-pill" data-emotion="Healing">Healing</button>
      <button class="emotion-pill" data-emotion="Rage">Rage</button>
      <button class="emotion-pill" data-emotion="Joy">Joy</button>
      <button class="emotion-pill" data-emotion="Loneliness">Loneliness</button>
      <button class="emotion-pill" data-emotion="Freedom">Freedom</button>
      <button class="emotion-pill" data-emotion="Anxiety">Anxiety</button>

    </div>


    <button id="postBtn" class="primary-btn">
      Post
    </button>

  </div>

</div>


<script src="script.js"></script>
</body>
</html>
