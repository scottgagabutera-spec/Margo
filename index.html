<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MARGO — Drop Your Line</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- THEME TOGGLE -->
<button id="themeToggle" class="theme-toggle">🌓</button>

<!-- LANDING -->
<section id="landing" class="screen active">

  <div class="hero">

    <h1 class="logo">MARGO</h1>

    <p class="tagline">
      When words fail, drop a lyric.
    </p>

    <p class="sub">
      Curse. Confess. Quote. Feel.
    </p>

    <button id="openComposer" class="primary-btn">
      Drop Your Line
    </button>

    <p class="hint">Swipe to explore ↓</p>

  </div>

</section>


<!-- FEED -->
<section id="feed" class="screen">

  <header class="feed-header">

    <button id="backBtn">←</button>

    <h2>Live Feed</h2>

    <button id="newPostBtn">＋</button>

  </header>

  <div id="feedList" class="feed-grid"></div>

</section>


<!-- COMPOSER -->
<div id="composer" class="composer hidden">

  <div class="composer-card">

    <header>
      <h3>Drop Your Line</h3>
      <button id="closeComposer">✕</button>
    </header>

    <textarea
      id="textInput"
      placeholder="Write what you feel..."
      maxlength="140"
    ></textarea>

    <div class="counter">
      <span id="count">0</span>/140
    </div>

    <div class="row">

      <input
        id="songInput"
        placeholder="Inspired by song"
      />

      <input
        id="artistInput"
        placeholder="Artist"
      />

    </div>

    <!-- HIDE MODE -->
    <label class="hide-row">
      <input type="checkbox" id="hideMode" />
      Hide inspiration
    </label>

    <!-- EMOTIONS -->
    <div class="emotions">

      <span class="emotion" data-emotion="Love">Love</span>
      <span class="emotion" data-emotion="Heartbreak">Heartbreak</span>
      <span class="emotion" data-emotion="Hope">Hope</span>
      <span class="emotion" data-emotion="Healing">Healing</span>
      <span class="emotion" data-emotion="Rage">Rage</span>
      <span class="emotion" data-emotion="Joy">Joy</span>
      <span class="emotion" data-emotion="Loneliness">Loneliness</span>
      <span class="emotion" data-emotion="Freedom">Freedom</span>
      <span class="emotion" data-emotion="Anxiety">Anxiety</span>

    </div>

    <button id="postBtn" class="primary-btn full">
      Post
    </button>

  </div>

</div>


<script src="script.js"></script>

</body>
</html>
