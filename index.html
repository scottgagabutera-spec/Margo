<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MARGO — Music As Raw Genuine Overflow</title>
  <meta name="description" content="Share emotions through lyrics.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<section id="landing" class="screen active">
  <div class="center">
    <h1 class="logo">MARGO</h1>
    <p class="tagline">When words fail, drop a lyric.</p>

    <div class="choices">
      <button class="choice-btn" data-mode="express">
        Let others guess my emotion
      </button>
      <button class="choice-btn" data-mode="discover">
        I want to discover how others feel
      </button>
    </div>
  </div>
</section>

<section id="composer" class="screen">
  <div class="composer-card">
    <h2>Drop your line</h2>
    <p class="hint">A lyric that feels like your current emotion.</p>
    <textarea id="lyricInput" maxlength="160" placeholder="I'm scared of falling in love again..."></textarea>
    <input id="songInput" placeholder="Song title">
    <input id="artistInput" placeholder="Artist">
    <button id="postBtn" class="primary-btn">Share feeling</button>
  </div>
</section>

<section id="feed" class="screen">
  <header class="feed-header">
    <h2>Shared Feelings</h2>
    <button id="newPostBtn">＋</button>
  </header>
  <div id="feedList" class="feed-list"></div>
</section>

<div id="postcard" class="modal hidden">
  <div class="postcard-card">
    <p id="pcText" class="pc-text"></p>
    <p id="pcSong" class="pc-song"></p>
    <button id="shareBtn" class="primary-btn">Copy & Share</button>
    <button id="closePcBtn" class="secondary-btn">Close</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
