<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MARGO — Music As Raw Genuine Overflow</title>
  <meta name="description" content="When words fail, drop a lyric.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LANDING -->
<section id="landing" class="screen active">
  <div class="center">
    <h1 class="logo">MARGO</h1>
    <p class="tagline">When words fail, drop a lyric.</p>
    <button id="startBtn" class="primary-btn">Drop a line</button>
  </div>
</section>

<!-- COMPOSER -->
<section id="composer" class="screen">
  <div class="composer-card">

    <h2>Do you want people to guess the song?</h2>
    <div class="mode-choices">
      <button class="mode-btn" data-mode="guess">Yes, let them guess</button>
      <button class="mode-btn" data-mode="discover">No, I just want to share</button>
    </div>

    <div id="form" class="hidden">
      <textarea id="lyricInput" placeholder="Type a lyric that feels like you..."></textarea>

      <div id="songFields">
        <input id="songInput" placeholder="Song (optional)">
        <input id="artistInput" placeholder="Artist (optional)">
      </div>

      <button id="postBtn" class="primary-btn">Post</button>
    </div>

  </div>
</section>

<!-- FEED -->
<section id="feed" class="screen">
  <header class="feed-header">
    <h2>Shared Feelings</h2>
    <button id="newPostBtn">＋</button>
  </header>
  <div id="feedList" class="feed-list"></div>
</section>

<!-- POSTCARD -->
<div id="postcard" class="modal hidden">
  <div class="postcard-card">
    <p id="pcText" class="pc-text"></p>
    <p id="pcSong" class="pc-song"></p>
    <button id="shareBtn" class="primary-btn">Copy & Share</button>
    <button id="closePcBtn" class="secondary-btn">Close</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
