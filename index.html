<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>MARGO — When words fail, drop a line</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- LANDING -->
<section id="landing" class="screen active">
  <div class="center">
    <h1 class="logo">MARGO</h1>
    <p class="tagline">When words fail, drop a line.</p>
    <button id="enterBtn" type="button" class="primary-btn">Drop a line</button>
  </div>
</section>

<!-- FEED -->
<section id="feed" class="screen">
  <header class="feed-header">
    <button id="backBtn" type="button" class="header-btn">← Back</button>
    <div class="header-center">
      <h2>Live Feed</h2>
      <p class="post-count"><span id="postCount">0</span> posts</p>
    </div>
    <button id="openComposer" type="button" class="header-btn">+ Drop</button>
  </header>
  <div id="feedList" class="feed-list"></div>
</section>

<!-- COMPOSER MODAL -->
<div id="composer" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Drop a line</h3>
      <button id="closeComposer" type="button" class="close-btn" aria-label="Close">×</button>
    </div>
    <div class="modal-body">
      <label for="textInput">Lyric</label>
      <textarea id="textInput" maxlength="140" placeholder="The line stuck in your head..." aria-describedby="charCountDesc"></textarea>
      <div class="char-count" id="charCountDesc"><span id="charCount">0</span>/140</div>

      <label>Emotion</label>
      <div class="emotion-pills" role="radiogroup" aria-label="Select emotion">
        <button class="emotion-pill" data-emotion="Love" type="button">Love</button>
        <button class="emotion-pill" data-emotion="Heartbreak" type="button">Heartbreak</button>
        <button class="emotion-pill" data-emotion="Hope" type="button">Hope</button>
        <button class="emotion-pill" data-emotion="Nostalgia" type="button">Nostalgia</button>
        <button class="emotion-pill" data-emotion="Healing" type="button">Healing</button>
        <button class="emotion-pill" data-emotion="Joy" type="button">Joy</button>
        <button class="emotion-pill" data-emotion="Rage" type="button">Rage</button>
        <button class="emotion-pill" data-emotion="Loneliness" type="button">Loneliness</button>
      </div>

      <label>What's your intention?</label>
      <div class="mode-options" role="radiogroup" aria-label="Post mode">
        <button class="mode-btn active" data-mode="share" type="button">
          <span class="mode-icon">♫</span><span>Share</span>
        </button>
        <button class="mode-btn" data-mode="guess" type="button">
          <span class="mode-icon">?</span><span>Guess</span>
        </button>
        <button class="mode-btn" data-mode="discover" type="button">
          <span class="mode-icon">✨</span><span>Discover</span>
        </button>
      </div>

      <div id="shareInputs" class="conditional active">
        <input id="songInput" placeholder="Song title" required type="text"/>
        <input id="artistInput" placeholder="Artist" required type="text"/>
      </div>

      <div id="guessInputs" class="conditional">
        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="guessSongCheck" checked>
            <span>Let them guess the song</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="guessArtistCheck" checked>
            <span>Let them guess the artist</span>
          </label>
        </div>
        <input id="guessSongAnswer" placeholder="Correct song title" type="text"/>
        <input id="guessArtistAnswer" placeholder="Correct artist" type="text"/>
      </div>

      <div id="discoverInputs" class="conditional">
        <p class="hint">Don't know the song? The community will help you discover it!</p>
        <input id="discoverSongInput" placeholder="Maybe song? (optional)" type="text"/>
        <input id="discoverArtistInput" placeholder="Maybe artist? (optional)" type="text"/>
      </div>

      <details class="streaming-section">
        <summary>+ Add Streaming Links (Optional)</summary>
        <div class="streaming-links">
          <div class="input-group-small">
            <label for="spotifyLink">Spotify</label>
            <input id="spotifyLink" type="url" placeholder="https://open.spotify.com/track/..."/>
          </div>
          <div class="input-group-small">
            <label for="appleLink">Apple Music</label>
            <input id="appleLink" type="url" placeholder="https://music.apple.com/..."/>
          </div>
          <div class="input-group-small">
            <label for="youtubeLink">YouTube</label>
            <input id="youtubeLink" type="url" placeholder="https://youtube.com/watch?v=..."/>
          </div>
          <div class="input-group-small">
            <label for="soundcloudLink">SoundCloud</label>
            <input id="soundcloudLink" type="url" placeholder="https://soundcloud.com/..."/>
          </div>
        </div>
      </details>
    </div>
    <div class="modal-footer">
      <button id="postBtn" type="button" class="primary-btn full">Post</button>
    </div>
  </div>
</div>

<!-- GUESS MODAL -->
<div id="guessModal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Guess the Song</h3>
      <button id="closeGuess" type="button" class="close-btn" aria-label="Close">×</button>
    </div>
    <div class="modal-body">
      <div class="lyric-display" id="guessLyric"></div>
      <p class="hint" id="guessHint"></p>
      <div id="guessInputFields">
        <input id="guessSongInput" placeholder="Song title" class="guess-field" type="text"/>
        <input id="guessArtistInput" placeholder="Artist" class="guess-field" type="text"/>
      </div>
      <div id="guessResult" class="result-message hidden"></div>
    </div>
    <div class="modal-footer">
      <button id="submitGuess" type="button" class="primary-btn full">Submit Guess</button>
      <button id="revealAnswer" type="button" class="secondary-btn full hidden">Reveal Answer</button>
    </div>
  </div>
</div>

<!-- other modals remain mostly the same, just added type="button" and aria-label where useful -->

<script src="script.js"></script>
</body>
</html>
