<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MARGO — When words fail, drop a line</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- LANDING -->
<section id="landing" class="screen active">
  <div class="center">
    <h1 class="logo">MARGO</h1>
    <p class="tagline">When words fail, drop a line.</p>
    <button id="enterBtn" class="primary-btn">Drop a line</button>
  </div>
</section>

<!-- FEED -->
<section id="feed" class="screen">
  <header class="feed-header">
    <button id="backBtn" class="header-btn">←</button>
    <div class="header-center">
      <h2>Live Feed</h2>
      <p class="post-count"><span id="postCount">0</span> posts</p>
    </div>
    <button id="openComposer" class="header-btn">+ Drop</button>
  </header>
  <div id="feedList" class="feed-list"></div>
</section>

<!-- COMPOSER -->
<div id="composer" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Drop a line</h3>
      <button id="closeComposer" class="close-btn">×</button>
    </div>

    <div class="modal-body">
      <label>Lyric</label>
      <textarea id="textInput" maxlength="140" placeholder="The line stuck in your head..."></textarea>
      <div class="char-count"><span id="charCount">0</span>/140</div>

      <label>Mode</label>
      <div class="mode-options">
        <button class="mode-btn active" data-mode="share">Share</button>
        <button class="mode-btn" data-mode="guess">Guess</button>
        <button class="mode-btn" data-mode="discover">Discover</button>
      </div>

      <!-- SHARE -->
      <div id="shareInputs" class="conditional active">
        <input id="songInput" placeholder="Song title"/>
        <input id="artistInput" placeholder="Artist"/>
        <label>Listen links (optional)</label>
        <input id="spotifyLink" placeholder="Spotify link"/>
        <input id="appleLink" placeholder="Apple Music link"/>
        <input id="youtubeLink" placeholder="YouTube link"/>
      </div>

      <!-- GUESS -->
      <div id="guessInputs" class="conditional">
        <input id="guessSongAnswer" placeholder="Correct song"/>
        <input id="guessArtistAnswer" placeholder="Correct artist"/>
      </div>

      <!-- DISCOVER -->
      <div id="discoverInputs" class="conditional">
        <p class="hint">Let the community help identify this song</p>
        <input id="discoverSongInput" placeholder="Maybe song?"/>
        <input id="discoverArtistInput" placeholder="Maybe artist?"/>
      </div>

      <label>Emotion</label>
      <div class="emotion-pills">
        <button class="emotion-pill" data-emotion="Love">Love</button>
        <button class="emotion-pill" data-emotion="Heartbreak">Heartbreak</button>
        <button class="emotion-pill" data-emotion="Hope">Hope</button>
        <button class="emotion-pill" data-emotion="Nostalgia">Nostalgia</button>
        <button class="emotion-pill" data-emotion="Healing">Healing</button>
        <button class="emotion-pill" data-emotion="Joy">Joy</button>
      </div>
    </div>

    <div class="modal-footer">
      <button id="postBtn" class="primary-btn full">Post</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
