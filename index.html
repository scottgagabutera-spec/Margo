<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MARGO — When words fail, drop a lyric</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- APP ROOT -->
<div id="app">

  <!-- LANDING SCREEN -->
  <section id="landing" class="screen active">
    <div class="landing-center">
      <h1 class="logo">MARGO</h1>
      <p class="tagline">When words fail, drop a lyric.</p>
      <button id="enterBtn" class="btn-primary">Drop a Lyric</button>
    </div>

    <footer class="landing-footer">
      <p>No login. No ads. Just raw feelings.</p>
      <small>User-generated quotes • Music via Spotify & Apple Music</small>
    </footer>
  </section>

  <!-- FEED SCREEN -->
  <section id="feed" class="screen">
    <header class="app-header">
      <button class="icon-btn" id="backBtn">←</button>
      <div class="header-center">
        <h2>Live Feed</h2>
        <span id="postCount" class="meta-text">0 posts</span>
      </div>
      <button class="btn-primary small" id="openComposer">Drop</button>
    </header>

    <main class="content">
      <div id="feedList" class="feed-list">
        <!-- Feed cards injected here -->
      </div>
    </main>
  </section>

</div>

<!-- Scripts -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="script.js"></script>

</body>
</html>
