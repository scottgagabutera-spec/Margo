<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MARGO</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- LANDING -->
<section id="landing" class="screen active">
  <div class="center">
    <h1>MARGO</h1>
    <p>When words fail, drop a lyric.</p>
    <small>Curse. Confess. Quote. Feel.</small>

    <button id="enterBtn" class="primary-btn">Enter</button>
  </div>
</section>


<!-- FEED -->
<section id="feed" class="screen">

  <header>
    <button id="backBtn">←</button>
    <h2>Live Feed</h2>
    <button id="openComposer">＋</button>
  </header>

  <div id="feedList" class="feed-grid"></div>

</section>


<!-- COMPOSER MODAL -->
<div id="composer" class="modal hidden">

  <div class="modal-box">

    <div class="modal-header">
      <h3>Drop Your Line</h3>
      <button id="closeComposer">✕</button>
    </div>

    <textarea
      id="textInput"
      maxlength="140"
      placeholder="Write what you feel..."
    ></textarea>

    <div class="count">
      <span id="count">0</span>/140
    </div>

    <div class="inputs">
      <input id="songInput" placeholder="Inspired by song" />
      <input id="artistInput" placeholder="Artist" />
    </div>

    <label class="hide-row">
      <input type="checkbox" id="hideCheck" />
      Hide inspiration
    </label>

    <div class="emotions">
      <button class="emotion-pill" data-emotion="Love">Love</button>
      <button class="emotion-pill" data-emotion="Heartbreak">Heartbreak</button>
      <button class="emotion-pill" data-emotion="Hope">Hope</button>
      <button class="emotion-pill" data-emotion="Healing">Healing</button>
      <button class="emotion-pill" data-emotion="Rage">Rage</button>
      <button class="emotion-pill" data-emotion="Joy">Joy</button>
      <button class="emotion-pill" data-emotion="Loneliness">Loneliness</button>
      <button class="emotion-pill" data-emotion="Freedom">Freedom</button>
      <button class="emotion-pill" data-emotion="Anxiety">Anxiety</button>
    </div>

    <button id="postBtn" class="primary-btn full">Post</button>

  </div>
</div>


<script src="script.js"></script>
</body>
</html>
