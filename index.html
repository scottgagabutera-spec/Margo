<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>MARGO — When words fail, drop a lyric</title>

<link rel="stylesheet" href="style.css"/>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display&display=swap" rel="stylesheet">

</head>

<body>

<div id="app">

<!-- LANDING -->
<section id="landing" class="screen active">

<header class="landing-header">
  <div class="logo">MARGO</div>
  <p class="tagline">When words fail, drop a lyric.</p>
  <p class="subtagline">Curse. Confess. Quote. Feel.</p>
</header>

<main>
  <button id="openComposer" class="cta-btn">Drop Your Line</button>
</main>

<footer class="landing-footer">
  <p>No login. No ads. Just raw feelings.</p>
</footer>

</section>


<!-- FEED -->
<section id="feed" class="screen">

<header class="feed-header">
  <h2>Live Feed</h2>
</header>

<div id="feedList" class="feed-grid"></div>

</section>


<!-- COMPOSER -->
<div id="composer" class="modal hidden">

<div class="modal-content">

<div class="modal-header">
<h3>Drop Your Line</h3>
<button id="closeComposer" class="close-btn">✕</button>
</div>

<div class="composer-body">

<textarea id="textInput" maxlength="140" placeholder="Drop your line..."></textarea>
<div class="counter"><span id="count">0</span>/140</div>

<div class="input-row">

<div>
<label>Song</label>
<input id="songInput" type="text"/>
</div>

<div>
<label>Artist</label>
<input id="artistInput" type="text"/>
</div>

</div>

<div class="emotion-pills" id="emotionPills">

<button class="emotion-pill" data-emotion="Love">Love</button>
<button class="emotion-pill" data-emotion="Heartbreak">Heartbreak</button>
<button class="emotion-pill" data-emotion="Hope">Hope</button>
<button class="emotion-pill" data-emotion="Nostalgia">Nostalgia</button>
<button class="emotion-pill" data-emotion="Healing">Healing</button>
<button class="emotion-pill" data-emotion="Rage">Rage</button>
<button class="emotion-pill" data-emotion="Joy">Joy</button>
<button class="emotion-pill" data-emotion="Loneliness">Loneliness</button>
<button class="emotion-pill" data-emotion="Freedom">Freedom</button>
<button class="emotion-pill" data-emotion="Anxiety">Anxiety</button>

</div>

</div>

<div class="actions">
<button id="postBtn" class="primary-btn">Post</button>
</div>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
