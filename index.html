<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MARGO — When words fail, drop a line</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- LANDING -->
<section id="landing" class="screen active">
  <div class="landing-center">
    <h1 class="logo">MARGO</h1>
    <p class="tagline">When words fail, drop a line.</p>
    <button id="enterBtn" class="primary-btn">Enter</button>
  </div>
</section>

<!-- FEED -->
<section id="feed" class="screen">
  <header class="feed-header">
    <h2>Live Feed</h2>
    <button id="openComposer" class="primary-btn small">Drop a line</button>
  </header>

  <main id="feedList" class="feed-list"></main>
</section>

<!-- COMPOSER -->
<div id="composer" class="modal hidden">
  <div class="modal-content">
    <header class="modal-header">
      <h3>Drop a line</h3>
      <button id="closeComposer" class="close-btn">×</button>
    </header>

    <div class="modal-body">
      <label>Your line</label>
      <textarea id="textInput" maxlength="140" placeholder="Inspired by a song…"></textarea>
      <div class="counter"><span id="count">0</span>/140</div>

      <label>Song</label>
      <input id="songInput" type="text" placeholder="Song title" />

      <label>Artist</label>
      <input id="artistInput" type="text" placeholder="Artist name" />
    </div>

    <footer class="modal-footer">
      <button id="postBtn" class="primary-btn full">Post</button>
    </footer>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
