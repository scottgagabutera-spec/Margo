<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MARGO — Music As Raw Genuine Overflow</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<!-- LANDING -->
<section id="landing" class="screen active">
  <div class="center">
    <h1 class="logo">MARGO</h1>
    <p class="subtitle">Music As Raw Genuine Overflow</p>
    <p class="tagline">When words fail, drop a lyric.</p>
    <button id="enterBtn" class="primary-btn">Drop Your Line</button>
  </div>
</section>

<!-- FEED -->
<section id="feed" class="screen">
  <header class="feed-header">
    <h2>Live Feed</h2>
    <button id="openComposer" class="add-btn">＋</button>
  </header>
  <div id="feedList" class="feed-list"></div>
</section>

<!-- COMPOSER -->
<div id="composer" class="modal hidden">
  <div class="modal-card">
    <h3>Drop Your Line</h3>
    <textarea id="textInput" maxlength="140" placeholder="Type the lyric that's stuck in your soul..."></textarea>
    <input id="songInput" type="text" placeholder="Song title">
    <input id="artistInput" type="text" placeholder="Artist">
    <label class="checkbox">
      <input type="checkbox" id="hideSongCheck">
      Hide track — let them guess
    </label>
    <div class="emotion-row">
      <button class="emotion" data-emotion="Love">Love</button>
      <button class="emotion" data-emotion="Heartbreak">Heartbreak</button>
      <button class="emotion" data-emotion="Hope">Hope</button>
      <button class="emotion" data-emotion="Healing">Healing</button>
      <button class="emotion" data-emotion="Loneliness">Loneliness</button>
    </div>
    <button id="postBtn" class="primary-btn">Post</button>
    <button id="closeComposer" class="secondary-btn">Cancel</button>
  </div>
</div>

<!-- POSTCARD -->
<div id="postcard" class="modal hidden">
  <div class="postcard-card">
    <button id="closePostcard" class="secondary-btn">Close</button>
    <p id="postcardText" class="postcard-text"></p>
    <p id="postcardSong" class="postcard-song"></p>
    <button id="guessBtn" class="primary-btn hidden">Guess Song</button>
  </div>
</div>

<!-- GUESS MODAL -->
<div id="guessModal" class="modal hidden">
  <div class="modal-card">
    <h3>Name the track</h3>
    <input id="guessSongInput" placeholder="Song title">
    <input id="guessArtistInput" placeholder="Artist">
    <button id="submitGuess" class="primary-btn">Submit</button>
    <p id="guessResult"></p>
    <button id="closeGuess" class="secondary-btn">Close</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
