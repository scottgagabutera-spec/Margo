<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MARGO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- LANDING -->
<section id="landing" class="screen active">
  <div class="center">
    <h1 class="logo">MARGO</h1>
    <p class="tagline">When words fail, drop a line.</p>
    <button id="enterBtn" class="primary-btn">
      <span>Enter</span>
    </button>
  </div>
</section>

<!-- FEED -->
<section id="feed" class="screen">
  <header class="feed-header">
    <button id="openComposer" class="drop-btn">Drop a Line</button>
  </header>

  <div id="feedList" class="feed-list"></div>
</section>

<!-- COMPOSER -->
<div id="composer" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Drop a Line</h3>
      <button id="closeComposer" class="close-btn">×</button>
    </div>

    <div class="modal-body">
      <textarea id="textInput" maxlength="160" placeholder="A line that stayed with you…"></textarea>
      <div class="counter"><span id="count">0</span>/160</div>

      <input id="songInput" type="text" placeholder="Song title (optional)" />
      <input id="artistInput" type="text" placeholder="Artist (optional)" />
    </div>

    <div class="modal-footer">
      <button id="postBtn" class="primary-btn full-width">
        <span>Post</span>
      </button>
    </div>
  </div>
</div>

<!-- POSTCARD -->
<div id="postcard" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h3>MARGO</h3>
      <button id="closePostcardBtn" class="close-btn">×</button>
    </div>
    <div class="modal-body postcard">
      <p id="postcardText"></p>
      <div id="postcardSong"></div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
