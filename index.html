<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>MARGO — When words fail, drop a lyric</title>
<link rel="stylesheet" href="style.css"/>
<!-- Clean, Professional Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- LANDING -->
<section id="landing" class="screen active">
<div class="center">
<h1 class="logo">MARGO</h1>
<p class="tagline">When words fail, drop a lyric.</p>
<button id="enterBtn" class="primary-btn">Drop Your Line</button>
<div class="swipe-indicator">
<span class="swipe-text">Swipe to explore</span>
<span class="swipe-arrow">→</span>
</div>
</div>
<footer class="landing-footer">
<p>No login. No ads. Just raw feelings.</p>
</footer>
</section>

<!-- FEED -->
<section id="feed" class="screen">
<header class="feed-header">
<button id="backBtn" class="back-btn">←</button>
<div class="header-center">
<h2>Live Feed</h2>
<p class="post-count"><span id="postCount">0</span> posts</p>
</div>
<button id="openComposer" class="drop-btn">Drop Your Line</button>
</header>
<div id="feedList" class="feed-list"></div>
</section>

<!-- COMPOSER MODAL -->
<div id="composer" class="modal hidden">
<div class="modal-content">
<div class="modal-header">
<h3>Drop Your Line</h3>
<button id="closeComposer" class="close-btn">×</button>
</div>
<div class="modal-body">
<textarea id="textInput" maxlength="140" placeholder="Type the lyric that's stuck in your soul..."></textarea>
<div class="counter"><span id="count">0</span>/140</div>

<div class="input-row">
<div class="input-group">
<label>Song Title</label>
<input id="songInput" type="text" placeholder="Song name" />
</div>
<div class="input-group">
<label>Artist</label>
<input id="artistInput" type="text" placeholder="Who said it?" />
</div>
</div>

<div class="emotion-section">
<label>Tag the vibe:</label>
<div class="emotion-pills">
<button class="emotion-pill" data-emotion="Love">Love</button>
<button class="emotion-pill" data-emotion="Heartbreak">Heartbreak</button>
<button class="emotion-pill" data-emotion="Hope">Hope</button>
<button class="emotion-pill" data-emotion="Nostalgia">Nostalgia</button>
<button class="emotion-pill" data-emotion="Healing">Healing</button>
<button class="emotion-pill" data-emotion="Rage">Rage</button>
<button class="emotion-pill" data-emotion="Joy">Joy</button>
<button class="emotion-pill" data-emotion="Loneliness">Loneliness</button>
<button class="emotion-pill" data-emotion="Freedom">Freedom</button>
<button class="emotion-pill" data-emotion="Anxiety">Anxiety</button>
</div>
</div>

<div class="hide-song-option">
<label class="checkbox-label">
<input type="checkbox" id="hideSongCheck" />
<span class="checkbox-custom"></span>
<span class="checkbox-text">Hide song — let them guess (3 attempts)</span>
</label>
</div>
</div>

<div class="modal-footer">
<button id="postBtn" class="primary-btn full-width">Post It</button>
</div>
</div>
</div>

<!-- POSTCARD MODAL -->
<div id="postcard" class="modal hidden">
<div class="modal-content postcard-content">
<div class="modal-header">
<h3>Your Card</h3>
<button id="closePostcardBtn" class="close-btn">×</button>
</div>
<div class="modal-body">
<div id="postcardCard" class="postcard-card">
<div class="card-inner">
<p id="postcardText" class="card-text"></p>
<div id="postcardEmotions" class="card-emotions"></div>
<div class="card-song">
<div id="postcardSongInfo"></div>
</div>
<div class="card-branding">MARGO</div>
</div>
</div>
</div>
<div class="modal-footer">
<div class="card-actions">
<button id="shareBtn" class="action-btn">
<span>Share</span>
</button>
<button id="listenBtn" class="action-btn">
<span>Listen</span>
</button>
<button id="downloadBtn" class="action-btn">
<span>Save</span>
</button>
</div>
</div>
</div>
</div>

<!-- GUESS MODAL -->
<div id="guessModal" class="modal hidden">
<div class="modal-content">
<div class="modal-header">
<h3>Guess the Song</h3>
<button id="closeGuess" class="close-btn">×</button>
</div>
<div class="modal-body">
<p class="guess-lyric" id="guessLyric"></p>
<p class="guess-hint">You have 3 attempts. After that, you can reveal the answer.</p>
<div class="input-group">
<label>Song Title</label>
<input id="guessSongInput" type="text" placeholder="Enter song name" />
</div>
<div class="input-group">
<label>Artist</label>
<input id="guessArtistInput" type="text" placeholder="Enter artist name" />
</div>
<div id="guessResult" class="guess-result hidden"></div>
</div>
<div class="modal-footer">
<button id="submitGuess" class="primary-btn full-width">Submit Guess</button>
</div>
</div>
</div>

<!-- SHARE MODAL -->
<div id="shareModal" class="modal hidden">
<div class="modal-content">
<div class="modal-header">
<h3>Share</h3>
<button id="closeShare" class="close-btn">×</button>
</div>
<div class="modal-body">
<div class="share-grid">
<button class="share-btn" data-platform="native">Share</button>
<button class="share-btn" data-platform="link">Copy Link</button>
<button class="share-btn" data-platform="twitter">Twitter</button>
<button class="share-btn" data-platform="instagram">Instagram</button>
<button class="share-btn" data-platform="tiktok">TikTok</button>
<button class="share-btn" data-platform="whatsapp">WhatsApp</button>
</div>
</div>
</div>
</div>

<!-- LISTEN MODAL -->
<div id="listenModal" class="modal hidden">
<div class="modal-content">
<div class="modal-header">
<h3>Listen Now</h3>
<button id="closeListen" class="close-btn">×</button>
</div>
<div class="modal-body">
<div class="listen-grid">
<button class="listen-btn" data-platform="spotify">Spotify</button>
<button class="listen-btn" data-platform="apple">Apple Music</button>
<button class="listen-btn" data-platform="youtube">YouTube</button>
<button class="listen-btn" data-platform="soundcloud">SoundCloud</button>
</div>
</div>
</div>
</div>

<!-- Firebase & HTML2Canvas -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="script.js"></script>
</body>
</html>
