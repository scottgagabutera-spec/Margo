    .legal-footer-links a {

      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.3);
      text-decoration: none;
      transition: color 0.18s;
    }
    .legal-footer-links a:hover { color: #E8C547; }

</head>
