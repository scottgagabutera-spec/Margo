<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Confirm your Margo account</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;color:#18181b;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f4f5;padding:24px 16px 32px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:420px;background:#ffffff;border:1px solid #d4d4d8;border-radius:16px;overflow:hidden;">
          <tr>
            <td style="background:#0c0c0e;padding:20px 24px;text-align:center;">
              <img src="https://trymargo.com/margo-email-lockup.png" width="160" height="84" alt="Margo" style="display:block;margin:0 auto;max-width:160px;height:auto;border:0;" />
              <div style="font-family:system-ui,-apple-system,sans-serif;color:#e8c547;font-size:12px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;margin-top:8px;">
                MARGO
              </div>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 24px 8px;font-size:18px;font-weight:600;line-height:1.35;color:#18181b;">
              Confirm your email
            </td>
          </tr>
          <tr>
            <td style="padding:0 24px 24px;font-size:14px;line-height:1.5;color:#52525b;">
              One tap to finish signing up.
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:0 24px 24px;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#e8c547;color:#0c0c0e;border:1px solid #ca8a04;font-size:14px;font-weight:600;text-decoration:none;padding:14px 28px;border-radius:999px;">
                Confirm email
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:0 24px 24px;font-size:11px;line-height:1.45;color:#71717a;">
              If you did not sign up, ignore this email.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
