<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset your Margo password</title>
</head>
<body style="margin:0;padding:0;background:#0c0c0e;font-family:Georgia,'Times New Roman',serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0c0c0e;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:420px;background:#141416;border:1px solid #2a2a30;border-radius:16px;padding:28px 24px;">
          <tr>
            <td style="font-family:system-ui,-apple-system,sans-serif;color:#e8c547;font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;padding-bottom:12px;">
              Margo
            </td>
          </tr>
          <tr>
            <td style="font-family:system-ui,-apple-system,sans-serif;color:#f4f4f5;font-size:18px;font-weight:600;line-height:1.35;padding-bottom:12px;">
              Reset password
            </td>
          </tr>
          <tr>
            <td style="font-family:system-ui,-apple-system,sans-serif;color:#a1a1aa;font-size:14px;line-height:1.5;padding-bottom:24px;">
              This link expires soon.
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:20px;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#e8c547;color:#0c0c0e;font-family:system-ui,-apple-system,sans-serif;font-size:14px;font-weight:600;text-decoration:none;padding:14px 28px;border-radius:999px;">
                Choose new password
              </a>
            </td>
          </tr>
          <tr>
            <td style="font-family:system-ui,-apple-system,sans-serif;color:#71717a;font-size:11px;line-height:1.45;">
              If you did not ask for this, ignore this email.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
