<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset your Margo password</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;color:#0c0c0e;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f4f5;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:420px;background:#ffffff;border:1px solid #d4d4d8;border-radius:16px;padding:28px 24px;">
          <tr>
            <td style="color:#a16207;font-size:12px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;padding-bottom:12px;">
              Margo
            </td>
          </tr>
          <tr>
            <td style="color:#18181b;font-size:18px;font-weight:600;line-height:1.35;padding-bottom:8px;">
              Reset password
            </td>
          </tr>
          <tr>
            <td style="color:#52525b;font-size:14px;line-height:1.5;padding-bottom:24px;">
              This link and code expire in about an hour.
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=recovery" style="display:inline-block;background:#ca8a04;color:#0c0c0e;font-size:14px;font-weight:600;text-decoration:none;padding:14px 28px;border-radius:999px;">
                Choose new password
              </a>
            </td>
          </tr>
          <tr>
            <td style="color:#52525b;font-size:13px;line-height:1.5;padding-bottom:8px;">
              Or enter this code in the app:
            </td>
          </tr>
          <tr>
            <td style="color:#18181b;font-size:22px;font-weight:700;letter-spacing:0.28em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;padding-bottom:20px;">
              {{ .Token }}
            </td>
          </tr>
          <tr>
            <td style="color:#71717a;font-size:11px;line-height:1.45;">
              If you did not ask for this, ignore this email.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
